name: Win 11 RDP + Tailscale

on:
  workflow_dispatch:

jobs:
  windows-rdp:
    runs-on: ubuntu-24.04
    timeout-minutes: 350

    steps:
      - name: Install required packages
        run: |
          set -euxo pipefail

          sudo apt-get update

          sudo apt-get install -y \
            qemu-system-x86 \
            qemu-utils \
            ovmf \
            swtpm \
            swtpm-tools \
            xorriso \
            wimtools \
            p7zip-full \
            curl \
            wget \
            netcat-openbsd \
            socat \
            libxml2-utils \
            dnsutils

      - name: Install Tailscale
        run: |
          set -euxo pipefail

          curl -fsSL https://tailscale.com/install.sh | sh

      - name: Connect runner to Tailscale
        env:
          TS_AUTHKEY: ${{ secrets.TS_AUTHKEY }}
        run: |
          set -euxo pipefail

          if [ -z "${TS_AUTHKEY:-}" ]; then
            echo "ERROR: TS_AUTHKEY secret is missing."
            exit 1
          fi

          sudo tailscale up \
            --authkey="$TS_AUTHKEY" \
            --hostname="github-windows-rdp"

          sleep 5

          TS_IP="$(sudo tailscale ip -4 | head -n 1)"

          if [ -z "$TS_IP" ]; then
            echo "ERROR: Could not obtain Tailscale IPv4 address."
            sudo tailscale status
            exit 1
          fi

          echo "$TS_IP" > "$HOME/tailscale-ip.txt"

          echo "======================================"
          echo "TAILSCALE CONNECTED"
          echo "======================================"
          sudo tailscale status
          echo
          echo "Tailscale IPv4:"
          echo "$TS_IP"
          echo

      - name: Prepare workspace
        run: |
          set -euxo pipefail

          rm -rf "$HOME/windows-rdp"

          mkdir -p \
            "$HOME/windows-rdp" \
            "$HOME/windows-rdp/iso" \
            "$HOME/windows-rdp/work"

          WORK="$HOME/windows-rdp/work"

          echo "Workspace:"
          df -h "$HOME"

      - name: Download official Microsoft Windows ISO
        env:
          WINDOWS_ISO_URL: ${{ secrets.WINDOWS_ISO_URL }}
        run: |
          set -euxo pipefail

          if [ -z "${WINDOWS_ISO_URL:-}" ]; then
            echo "ERROR: WINDOWS_ISO_URL secret is missing."
            exit 1
          fi

          echo "Downloading Windows ISO..."

          curl -L \
            --fail \
            --retry 5 \
            --retry-delay 5 \
            -o "$HOME/windows-rdp/windows.iso" \
            "$WINDOWS_ISO_URL"

          ls -lh "$HOME/windows-rdp/windows.iso"

      - name: Extract Windows ISO
        run: |
          set -euxo pipefail

          ISO="$HOME/windows-rdp/windows.iso"
          EXTRACT="$HOME/windows-rdp/iso"

          echo "Extracting ISO..."

          7z x "$ISO" -o"$EXTRACT" -y

          ls -lah "$EXTRACT/sources"

      - name: Verify Windows 11 Pro image
        run: |
          set -euxo pipefail

          WIM="$HOME/windows-rdp/iso/sources/install.wim"
          INFO="$HOME/windows-rdp/work/wim-info.txt"

          if [ ! -f "$WIM" ]; then
            echo "ERROR: install.wim not found."
            exit 1
          fi

          echo "Reading WIM information..."

          wimlib-imagex info "$WIM" > "$INFO"

          cat "$INFO"

          if ! grep -q "Index: 6" "$INFO"; then
            echo "ERROR: Windows 11 Pro index 6 was not found."
            exit 1
          fi

          echo
          echo "Windows 11 Pro = Index 6 confirmed."

      - name: Create unattended Windows installation
        run: |
          set -euxo pipefail

          mkdir -p "$HOME/windows-rdp/autounattend"

          cat > "$HOME/windows-rdp/autounattend/Autounattend.xml" <<'XML'
          <?xml version="1.0" encoding="utf-8"?>
          <unattend xmlns="urn:schemas-microsoft-com:unattend">

            <settings pass="windowsPE">

              <component
                name="Microsoft-Windows-International-Core-WinPE"
                processorArchitecture="amd64"
                publicKeyToken="31bf3856ad364e35"
                language="neutral"
                versionScope="nonSxS">

                <SetupUILanguage>
                  <UILanguage>en-US</UILanguage>
                </SetupUILanguage>

                <InputLocale>en-US</InputLocale>
                <SystemLocale>en-US</SystemLocale>
                <UILanguage>en-US</UILanguage>
                <UserLocale>en-US</UserLocale>

              </component>

              <component
                name="Microsoft-Windows-Setup"
                processorArchitecture="amd64"
                publicKeyToken="31bf3856ad364e35"
                language="neutral"
                versionScope="nonSxS">

                <ImageInstall>
                  <OSImage>
                    <InstallFrom>
                      <MetaData wcm:action="add"
                        xmlns:wcm="http://schemas.microsoft.com/WMIConfig/2002/State">
                        <Key>/IMAGE/INDEX</Key>
                        <Value>6</Value>
                      </MetaData>
                    </InstallFrom>

                    <InstallTo>
                      <DiskID>0</DiskID>
                      <PartitionID>3</PartitionID>
                    </InstallTo>

                  </OSImage>
                </ImageInstall>

                <DiskConfiguration>
                  <Disk wcm:action="add"
                    xmlns:wcm="http://schemas.microsoft.com/WMIConfig/2002/State">

                    <DiskID>0</DiskID>
                    <WillWipeDisk>true</WillWipeDisk>

                    <CreatePartitions>

                      <CreatePartition
                        wcm:action="add"
                        xmlns:wcm="http://schemas.microsoft.com/WMIConfig/2002/State">
                        <Order>1</Order>
                        <Size>100</Size>
                        <Type>EFI</Type>
                      </CreatePartition>

                      <CreatePartition
                        wcm:action="add"
                        xmlns:wcm="http://schemas.microsoft.com/WMIConfig/2002/State">
                        <Order>2</Order>
                        <Size>16</Size>
                        <Type>MSR</Type>
                      </CreatePartition>

                      <CreatePartition
                        wcm:action="add"
                        xmlns:wcm="http://schemas.microsoft.com/WMIConfig/2002/State">
                        <Order>3</Order>
                        <Extend>true</Extend>
                        <Type>Primary</Type>
                      </CreatePartition>

                    </CreatePartitions>

                    <ModifyPartitions>

                      <ModifyPartition
                        wcm:action="add"
                        xmlns:wcm="http://schemas.microsoft.com/WMIConfig/2002/State">
                        <Order>1</Order>
                        <PartitionID>1</PartitionID>
                        <Format>FAT32</Format>
                        <Label>System</Label>
                      </ModifyPartition>

                      <ModifyPartition
                        wcm:action="add"
                        xmlns:wcm="http://schemas.microsoft.com/WMIConfig/2002/State">
                        <Order>2</Order>
                        <PartitionID>2</PartitionID>
                      </ModifyPartition>

                      <ModifyPartition
                        wcm:action="add"
                        xmlns:wcm="http://schemas.microsoft.com/WMIConfig/2002/State">
                        <Order>3</Order>
                        <PartitionID>3</PartitionID>
                        <Format>NTFS</Format>
                        <Label>Windows</Label>
                        <Letter>C</Letter>
                      </ModifyPartition>

                    </ModifyPartitions>

                  </Disk>
                </DiskConfiguration>

                <UserData>
                  <AcceptEula>true</AcceptEula>

                  <ProductKey>
                    <Key>VK7JG-NPHTM-C97JM-9MPGT-3V66T</Key>
                    <WillShowUI>Never</WillShowUI>
                  </ProductKey>

                </UserData>

              </component>

            </settings>

            <settings pass="specialize">

              <component
                name="Microsoft-Windows-TerminalServices-LocalSessionManager"
                processorArchitecture="amd64"
                publicKeyToken="31bf3856ad364e35"
                language="neutral"
                versionScope="nonSxS">

                <fDenyTSConnections>false</fDenyTSConnections>

              </component>

              <component
                name="Microsoft-Windows-TerminalServices-RDP-WinStation"
                processorArchitecture="amd64"
                publicKeyToken="31bf3856ad364e35"
                language="neutral"
                versionScope="nonSxS">

                <UserAuthentication>0</UserAuthentication>

              </component>

              <component
                name="Microsoft-Windows-Shell-Setup"
                processorArchitecture="amd64"
                publicKeyToken="31bf3856ad364e35"
                language="neutral"
                versionScope="nonSxS">

                <ComputerName>WIN11-RDP</ComputerName>

              </component>

            </settings>

            <settings pass="oobeSystem">

              <component
                name="Microsoft-Windows-International-Core"
                processorArchitecture="amd64"
                publicKeyToken="31bf3856ad364e35"
                language="neutral"
                versionScope="nonSxS">

                <InputLocale>en-US</InputLocale>
                <SystemLocale>en-US</SystemLocale>
                <UILanguage>en-US</UILanguage>
                <UserLocale>en-US</UserLocale>

              </component>

              <component
                name="Microsoft-Windows-Shell-Setup"
                processorArchitecture="amd64"
                publicKeyToken="31bf3856ad364e35"
                language="neutral"
                versionScope="nonSxS">

                <OOBE>
                  <HideEULAPage>true</HideEULAPage>
                  <HideOnlineAccountScreens>true</HideOnlineAccountScreens>
                  <HideOEMRegistrationScreen>true</HideOEMRegistrationScreen>
                  <HideWirelessSetupInOOBE>true</HideWirelessSetupInOOBE>
                  <ProtectYourPC>3</ProtectYourPC>
                  <SkipMachineOOBE>true</SkipMachineOOBE>
                  <SkipUserOOBE>true</SkipUserOOBE>
                </OOBE>

                <UserAccounts>

                  <LocalAccounts>

                    <LocalAccount
                      wcm:action="add"
                      xmlns:wcm="http://schemas.microsoft.com/WMIConfig/2002/State">

                      <Name>rdpuser</Name>
                      <DisplayName>RDP User</DisplayName>
                      <Group>Administrators</Group>
                      <Password>
                        <Value>${RDP_PASSWORD}</Value>
                        <PlainText>true</PlainText>
                      </Password>

                    </LocalAccount>

                  </LocalAccounts>

                </UserAccounts>

                <AutoLogon>
                  <Enabled>true</Enabled>
                  <Username>rdpuser</Username>
                  <LogonCount>5</LogonCount>
                  <Password>
                    <Value>${RDP_PASSWORD}</Value>
                    <PlainText>true</PlainText>
                  </Password>
                </AutoLogon>

                <FirstLogonCommands>

                  <SynchronousCommand
                    wcm:action="add"
                    xmlns:wcm="http://schemas.microsoft.com/WMIConfig/2002/State">

                    <Order>1</Order>
                    <CommandLine>powershell.exe -NoProfile -ExecutionPolicy Bypass -Command "Set-Service -Name TermService -StartupType Automatic"</CommandLine>
                    <Description>Enable Remote Desktop service</Description>

                  </SynchronousCommand>

                  <SynchronousCommand
                    wcm:action="add"
                    xmlns:wcm="http://schemas.microsoft.com/WMIConfig/2002/State">

                    <Order>2</Order>
                    <CommandLine>powershell.exe -NoProfile -ExecutionPolicy Bypass -Command "Set-ItemProperty -Path 'HKLM:\SYSTEM\CurrentControlSet\Control\Terminal Server' -Name fDenyTSConnections -Value 0"</CommandLine>
                    <Description>Enable RDP</Description>

                  </SynchronousCommand>

                  <SynchronousCommand
                    wcm:action="add"
                    xmlns:wcm="http://schemas.microsoft.com/WMIConfig/2002/State">

                    <Order>3</Order>
                    <CommandLine>powershell.exe -NoProfile -ExecutionPolicy Bypass -Command "Set-ItemProperty -Path 'HKLM:\SYSTEM\CurrentControlSet\Control\Terminal Server\WinStations\RDP-Tcp' -Name UserAuthentication -Value 0"</CommandLine>
                    <Description>Disable NLA requirement</Description>

                  </SynchronousCommand>

                  <SynchronousCommand
                    wcm:action="add"
                    xmlns:wcm="http://schemas.microsoft.com/WMIConfig/2002/State">

                    <Order>4</Order>
                    <CommandLine>powershell.exe -NoProfile -ExecutionPolicy Bypass -Command "Start-Service -Name TermService"</CommandLine>
                    <Description>Start Remote Desktop service</Description>

                  </SynchronousCommand>

                  <SynchronousCommand
                    wcm:action="add"
                    xmlns:wcm="http://schemas.microsoft.com/WMIConfig/2002/State">

                    <Order>5</Order>
                    <CommandLine>powershell.exe -NoProfile -ExecutionPolicy Bypass -Command "Enable-NetFirewallRule -DisplayGroup 'Remote Desktop'"</CommandLine>
                    <Description>Allow Remote Desktop firewall rules</Description>

                  </SynchronousCommand>

                  <SynchronousCommand
                    wcm:action="add"
                    xmlns:wcm="http://schemas.microsoft.com/WMIConfig/2002/State">

                    <Order>6</Order>
                    <CommandLine>powershell.exe -NoProfile -ExecutionPolicy Bypass -Command "Add-LocalGroupMember -Group 'Remote Desktop Users' -Member 'rdpuser' -ErrorAction SilentlyContinue"</CommandLine>
                    <Description>Add RDP user</Description>

                  </SynchronousCommand>

                  <SynchronousCommand
                    wcm:action="add"
                    xmlns:wcm="http://schemas.microsoft.com/WMIConfig/2002/State">

                    <Order>7</Order>
                    <CommandLine>powershell.exe -NoProfile -ExecutionPolicy Bypass -Command "Set-ItemProperty -Path 'HKLM:\SYSTEM\CurrentControlSet\Control\Terminal Server' -Name fSingleSessionPerUser -Value 0"</CommandLine>
                    <Description>Configure RDP sessions</Description>

                  </SynchronousCommand>

                </FirstLogonCommands>

              </component>

            </settings>

          </unattend>
          XML

          echo "Autounattend.xml created."

      - name: Inject password into unattended file
        env:
          RDP_PASSWORD: ${{ secrets.RDP_PASSWORD }}
        run: |
          set -euxo pipefail

          if [ -z "${RDP_PASSWORD:-}" ]; then
            echo "ERROR: RDP_PASSWORD secret is missing."
            exit 1
          fi

          python3 - <<'PY'
          import os
          from pathlib import Path

          p = Path.home() / "windows-rdp/autounattend/Autounattend.xml"
          s = p.read_text()

          password = os.environ["RDP_PASSWORD"]

          if any(x in password for x in ['<', '>', '&', '"']):
              raise SystemExit("RDP_PASSWORD contains XML-special characters. Use a password without < > & \".")

          s = s.replace("${RDP_PASSWORD}", password)

          p.write_text(s)

          print("Password inserted into unattended configuration.")
          PY

      - name: Create unattended ISO
        run: |
          set -euxo pipefail

          cd "$HOME/windows-rdp/autounattend"

          xorriso \
            -as mkisofs \
            -iso-level 3 \
            -V AUTOUNATTEND \
            -o "$HOME/windows-rdp/work/autounattend.iso" \
            Autounattend.xml

          ls -lh "$HOME/windows-rdp/work/autounattend.iso"

      - name: Create Windows virtual disk
        run: |
          set -euxo pipefail

          DISK="$HOME/windows-rdp/work/windows.qcow2"

          qemu-img create \
            -f qcow2 \
            "$DISK" \
            64G

          qemu-img info "$DISK"

      - name: Start TPM
        run: |
          set -euxo pipefail

          WORK="$HOME/windows-rdp/work"

          mkdir -p "$WORK/tpm"

          swtpm socket \
            --tpm2 \
            --tpmstate dir="$WORK/tpm" \
            --ctrl type=unixio,path="$WORK/swtpm.sock" \
            --daemon

          sleep 2

          if [ ! -S "$WORK/swtpm.sock" ]; then
            echo "ERROR: TPM socket was not created."
            exit 1
          fi

          echo "TPM 2.0 is running."

      - name: Start Windows VM
        run: |
          set -euxo pipefail

          WORK="$HOME/windows-rdp/work"

          OVMF_CODE="/usr/share/OVMF/OVMF_CODE_4M.fd"
          OVMF_VARS="/usr/share/OVMF/OVMF_VARS_4M.fd"

          if [ ! -f "$OVMF_CODE" ]; then
            OVMF_CODE="/usr/share/OVMF/OVMF_CODE.fd"
          fi

          if [ ! -f "$OVMF_VARS" ]; then
            OVMF_VARS="/usr/share/OVMF/OVMF_VARS.fd"
          fi

          cp "$OVMF_VARS" "$WORK/OVMF_VARS.fd"

          echo "Starting Windows 11 VM..."

          qemu-system-x86_64 \
            -accel tcg,thread=multi \
            -machine q35 \
            -cpu max \
            -m 8G \
            -smp 4 \
            -drive if=pflash,format=raw,readonly=on,file="$OVMF_CODE" \
            -drive if=pflash,format=raw,file="$WORK/OVMF_VARS.fd" \
            -chardev socket,id=chrtpm,path="$WORK/swtpm.sock" \
            -tpmdev emulator,id=tpm0,chardev=chrtpm \
            -device tpm-tis,tpmdev=tpm0 \
            -drive file="$WORK/windows.qcow2",format=qcow2,if=ide \
            -drive file="$HOME/windows-rdp/windows.iso",media=cdrom,readonly=on \
            -drive file="$WORK/autounattend.iso",media=cdrom,readonly=on \
            -netdev user,id=net0,hostfwd=tcp:127.0.0.1:3390-:3389 \
            -device e1000,netdev=net0 \
            -boot once=d \
            -display none \
            -serial file:"$WORK/qemu-serial.log" \
            -monitor unix:"$WORK/qemu-monitor.sock",server=on,wait=off \
            -pidfile "$WORK/qemu.pid" \
            -daemonize

          sleep 5

          if [ ! -f "$WORK/qemu.pid" ]; then
            echo "ERROR: QEMU did not start."
            cat "$WORK/qemu-serial.log" || true
            exit 1
          fi

          echo "QEMU started."
          echo "PID: $(cat "$WORK/qemu.pid")"

      - name: Create Tailscale RDP forwarder
        run: |
          set -euxo pipefail

          TS_IP="$(cat "$HOME/tailscale-ip.txt")"

          echo "Tailscale IP: $TS_IP"
          echo "Windows RDP backend: 127.0.0.1:3390"
          echo "Public Tailscale RDP: $TS_IP:3389"

          nohup socat \
            TCP-LISTEN:3389,bind="$TS_IP",reuseaddr,fork \
            TCP:127.0.0.1:3390 \
            > "$HOME/windows-rdp/work/socat.log" 2>&1 &

          echo $! > "$HOME/windows-rdp/work/socat.pid"

          sleep 2

          if ! kill -0 "$(cat "$HOME/windows-rdp/work/socat.pid")" 2>/dev/null; then
            echo "ERROR: socat failed to start."
            cat "$HOME/windows-rdp/work/socat.log" || true
            exit 1
          fi

          echo "Tailscale RDP forwarder is running."

      - name: Wait for Windows RDP
        run: |
          set -euxo pipefail

          TS_IP="$(cat "$HOME/tailscale-ip.txt")"

          echo "Waiting for Windows RDP..."

          READY=0

          for i in $(seq 1 120); do

            if nc -z 127.0.0.1 3390 2>/dev/null; then
              echo "Windows RDP backend is listening."

              if nc -z "$TS_IP" 3389 2>/dev/null; then
                echo "Tailscale RDP endpoint is listening."
                READY=1
                break
              fi
            fi

            if [ -f "$HOME/windows-rdp/work/qemu.pid" ]; then
              if ! kill -0 "$(cat "$HOME/windows-rdp/work/qemu.pid")" 2>/dev/null; then
                echo "ERROR: QEMU stopped."
                cat "$HOME/windows-rdp/work/qemu-serial.log" || true
                exit 1
              fi
            fi

            echo "Still waiting... $i/120"
            sleep 5

          done

          if [ "$READY" -ne 1 ]; then
            echo
            echo "ERROR: RDP did not become ready."
            echo
            echo "QEMU serial log:"
            cat "$HOME/windows-rdp/work/qemu-serial.log" || true
            echo
            echo "SOCAT log:"
            cat "$HOME/windows-rdp/work/socat.log" || true
            exit 1
          fi

      - name: Print RDP connection information
        run: |
          set -euxo pipefail

          TS_IP="$(cat "$HOME/tailscale-ip.txt")"

          echo
          echo "=================================================="
          echo "       WINDOWS 11 RDP IS READY"
          echo "=================================================="
          echo
          echo "RDP ADDRESS:"
          echo "$TS_IP:3389"
          echo
          echo "USERNAME:"
          echo "rdpuser"
          echo
          echo "PASSWORD:"
          echo "Use the value stored in the RDP_PASSWORD secret."
          echo
          echo "Tailscale IP:"
          echo "$TS_IP"
          echo
          echo "=================================================="
          echo
          echo "IMPORTANT:"
          echo "Your Android device must be logged into the"
          echo "same Tailscale network."
          echo
          echo "Do NOT use 127.0.0.1."
          echo "Do NOT use the GitHub runner public IP."
          echo "Use:"
          echo "$TS_IP:3389"
          echo
          echo "=================================================="

      - name: Keep VM alive
        run: |
          set -euxo pipefail

          WORK="$HOME/windows-rdp/work"

          echo
          echo "Windows VM is running."
          echo "Keeping the GitHub runner alive..."
          echo

          while true; do

            if [ ! -f "$WORK/qemu.pid" ]; then
              echo "QEMU PID file disappeared."
              exit 1
            fi

            QEMU_PID="$(cat "$WORK/qemu.pid")"

            if ! kill -0 "$QEMU_PID" 2>/dev/null; then
              echo "QEMU stopped."

              echo
              echo "===== QEMU SERIAL LOG ====="
              cat "$WORK/qemu-serial.log" || true

              echo
              echo "===== SOCAT LOG ====="
              cat "$WORK/socat.log" || true

              exit 1
            fi

            if [ ! -f "$WORK/socat.pid" ]; then
              echo "socat PID file disappeared."
              exit 1
            fi

            SOCAT_PID="$(cat "$WORK/socat.pid")"

            if ! kill -0 "$SOCAT_PID" 2>/dev/null; then
              echo "socat stopped."
              cat "$WORK/socat.log" || true
              exit 1
            fi

            echo "======================================"
            echo "Windows VM: RUNNING"
            echo "Tailscale:  RUNNING"
            echo "RDP:        $TS_IP:3389"
            echo "======================================"

            sleep 60

          done
