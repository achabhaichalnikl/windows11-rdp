name: Win 11 RDP + Tailscale

on:
  workflow_dispatch:

jobs:
  windows-rdp:
    runs-on: ubuntu-24.04
    timeout-minutes: 350

    steps:

      # ============================================================
      # 1. INSTALL PACKAGES
      # ============================================================
      - name: Install required packages
        run: |
          set -euxo pipefail

          sudo apt-get update

          sudo apt-get install -y \
            qemu-system-x86 \
            qemu-utils \
            ovmf \
            swtpm \
            swtpm-tools \
            xorriso \
            wimtools \
            p7zip-full \
            curl \
            wget \
            netcat-openbsd \
            socat \
            python3

      # ============================================================
      # 2. INSTALL TAILSCALE
      # ============================================================
      - name: Install Tailscale
        run: |
          set -euxo pipefail

          curl -fsSL https://tailscale.com/install.sh | sh

      # ============================================================
      # 3. CONNECT TAILSCALE
      # ============================================================
      - name: Connect runner to Tailscale
        env:
          TS_AUTHKEY: ${{ secrets.TS_AUTHKEY }}
        run: |
          set -euxo pipefail

          if [ -z "${TS_AUTHKEY:-}" ]; then
            echo "ERROR: TS_AUTHKEY secret is missing."
            exit 1
          fi

          sudo tailscale up \
            --authkey="$TS_AUTHKEY" \
            --hostname="github-windows-rdp"

          sleep 5

          TS_IP="$(sudo tailscale ip -4 | head -n 1)"

          if [ -z "$TS_IP" ]; then
            echo "ERROR: Could not get Tailscale IPv4."
            sudo tailscale status
            exit 1
          fi

          echo "$TS_IP" > "$HOME/tailscale-ip.txt"

          echo
          echo "=========================================="
          echo "TAILSCALE CONNECTED"
          echo "=========================================="
          echo
          sudo tailscale status
          echo
          echo "TAILSCALE IP:"
          echo "$TS_IP"
          echo

      # ============================================================
      # 4. PREPARE WORKSPACE
      # ============================================================
      - name: Prepare workspace
        run: |
          set -euxo pipefail

          rm -rf "$HOME/windows-rdp"

          mkdir -p \
            "$HOME/windows-rdp" \
            "$HOME/windows-rdp/iso" \
            "$HOME/windows-rdp/work" \
            "$HOME/windows-rdp/autounattend"

          df -h "$HOME"

      # ============================================================
      # 5. DOWNLOAD OFFICIAL MICROSOFT ISO
      # ============================================================
      - name: Download official Microsoft Windows ISO
        env:
          WINDOWS_ISO_URL: ${{ secrets.WINDOWS_ISO_URL }}
        run: |
          set -euxo pipefail

          if [ -z "${WINDOWS_ISO_URL:-}" ]; then
            echo "ERROR: WINDOWS_ISO_URL secret is missing."
            exit 1
          fi

          echo "Downloading official Microsoft Windows ISO..."

          curl \
            -L \
            --fail \
            --retry 5 \
            --retry-delay 5 \
            -o "$HOME/windows-rdp/windows.iso" \
            "$WINDOWS_ISO_URL"

          echo
          echo "ISO downloaded:"
          ls -lh "$HOME/windows-rdp/windows.iso"

      # ============================================================
      # 6. EXTRACT ISO
      # ============================================================
      - name: Extract Windows ISO
        run: |
          set -euxo pipefail

          ISO="$HOME/windows-rdp/windows.iso"
          EXTRACT="$HOME/windows-rdp/iso"

          echo "Extracting ISO..."

          7z x "$ISO" -o"$EXTRACT" -y

          echo
          echo "Sources:"
          ls -lh "$EXTRACT/sources"

      # ============================================================
      # 7. AUTOMATICALLY FIND WINDOWS 11 PRO
      # ============================================================
      - name: Detect Windows 11 Pro index
        run: |
          set -euxo pipefail

          WIM="$HOME/windows-rdp/iso/sources/install.wim"
          INFO="$HOME/windows-rdp/work/wim-info.txt"

          if [ ! -f "$WIM" ]; then
            echo "ERROR: install.wim not found."
            exit 1
          fi

          echo "Reading WIM information..."

          wimlib-imagex info "$WIM" > "$INFO"

          echo
          echo "=========================================="
          echo "AVAILABLE WINDOWS EDITIONS"
          echo "=========================================="
          cat "$INFO"
          echo "=========================================="
          echo

          PRO_INDEX="$(
            python3 - "$INFO" <<'PY'
          import sys
          import re

          path = sys.argv[1]

          text = open(
              path,
              encoding="utf-8",
              errors="ignore"
          ).read()

          blocks = re.split(
              r'\n(?=Index:\s*\d+)',
              text
          )

          found = None

          for block in blocks:

              match = re.search(
                  r'Index:\s*(\d+)',
                  block
              )

              if not match:
                  continue

              idx = match.group(1)

              name_match = re.search(
                  r'(?m)^Name:\s*(.+?)\s*$',
                  block
              )

              if not name_match:
                  continue

              name = name_match.group(1).strip()

              if name.lower() == "windows 11 pro":
                  found = idx
                  break

              if name.lower().endswith("windows 11 pro"):
                  found = idx
                  break

          if found is None:
              print("PRO_NOT_FOUND")
          else:
              print(found)
          PY
          )"

          echo
          echo "Detected Windows 11 Pro index: $PRO_INDEX"

          if [ "$PRO_INDEX" = "PRO_NOT_FOUND" ] || [ -z "$PRO_INDEX" ]; then
            echo
            echo "ERROR: Windows 11 Pro could not be found."
            echo
            cat "$INFO"
            exit 1
          fi

          echo "$PRO_INDEX" > "$HOME/windows-rdp/work/pro-index.txt"

          echo
          echo "=========================================="
          echo "WINDOWS 11 PRO FOUND"
          echo "INDEX: $PRO_INDEX"
          echo "=========================================="

      # ============================================================
      # 8. CREATE AUTOUNATTEND.XML
      # ============================================================
      - name: Create Autounattend.xml
        env:
          RDP_PASSWORD: ${{ secrets.RDP_PASSWORD }}
        run: |
          set -euxo pipefail

          if [ -z "${RDP_PASSWORD:-}" ]; then
            echo "ERROR: RDP_PASSWORD secret is missing."
            exit 1
          fi

          case "$RDP_PASSWORD" in
            *'<'*|*'>'*|*'&'*|*'"'*)
              echo "ERROR: RDP_PASSWORD contains XML-special characters."
              echo "Use a password without < > & or double quotes."
              exit 1
              ;;
          esac

          PRO_INDEX="$(cat "$HOME/windows-rdp/work/pro-index.txt")"

          cat > "$HOME/windows-rdp/autounattend/Autounattend.xml" <<XML
          <?xml version="1.0" encoding="utf-8"?>

          <unattend
            xmlns="urn:schemas-microsoft-com:unattend"
            xmlns:wcm="http://schemas.microsoft.com/WMIConfig/2002/State">

            <settings pass="windowsPE">

              <component
                name="Microsoft-Windows-International-Core-WinPE"
                processorArchitecture="amd64"
                publicKeyToken="31bf3856ad364e35"
                language="neutral"
                versionScope="nonSxS">

                <SetupUILanguage>
                  <UILanguage>en-US</UILanguage>
                </SetupUILanguage>

                <InputLocale>en-US</InputLocale>
                <SystemLocale>en-US</SystemLocale>
                <UILanguage>en-US</UILanguage>
                <UserLocale>en-US</UserLocale>

              </component>

              <component
                name="Microsoft-Windows-Setup"
                processorArchitecture="amd64"
                publicKeyToken="31bf3856ad364e35"
                language="neutral"
                versionScope="nonSxS">

                <DiskConfiguration>

                  <Disk wcm:action="add">

                    <DiskID>0</DiskID>
                    <WillWipeDisk>true</WillWipeDisk>

                    <CreatePartitions>

                      <CreatePartition wcm:action="add">
                        <Order>1</Order>
                        <Size>100</Size>
                        <Type>EFI</Type>
                      </CreatePartition>

                      <CreatePartition wcm:action="add">
                        <Order>2</Order>
                        <Size>16</Size>
                        <Type>MSR</Type>
                      </CreatePartition>

                      <CreatePartition wcm:action="add">
                        <Order>3</Order>
                        <Extend>true</Extend>
                        <Type>Primary</Type>
                      </CreatePartition>

                    </CreatePartitions>

                    <ModifyPartitions>

                      <ModifyPartition wcm:action="add">
                        <Order>1</Order>
                        <PartitionID>1</PartitionID>
                        <Format>FAT32</Format>
                        <Label>System</Label>
                      </ModifyPartition>

                      <ModifyPartition wcm:action="add">
                        <Order>2</Order>
                        <PartitionID>2</PartitionID>
                      </ModifyPartition>

                      <ModifyPartition wcm:action="add">
                        <Order>3</Order>
                        <PartitionID>3</PartitionID>
                        <Format>NTFS</Format>
                        <Label>Windows</Label>
                        <Letter>C</Letter>
                      </ModifyPartition>

                    </ModifyPartitions>

                  </Disk>

                  <WillShowUI>OnError</WillShowUI>

                </DiskConfiguration>

                <ImageInstall>

                  <OSImage>

                    <InstallFrom>

                      <MetaData wcm:action="add">
                        <Key>/IMAGE/INDEX</Key>
                        <Value>${PRO_INDEX}</Value>
                      </MetaData>

                    </InstallFrom>

                    <InstallTo>
                      <DiskID>0</DiskID>
                      <PartitionID>3</PartitionID>
                    </InstallTo>

                    <WillShowUI>OnError</WillShowUI>

                  </OSImage>

                </ImageInstall>

                <UserData>

                  <AcceptEula>true</AcceptEula>

                  <ProductKey>
                    <Key>VK7JG-NPHTM-C97JM-9MPGT-3V66T</Key>
                    <WillShowUI>Never</WillShowUI>
                  </ProductKey>

                </UserData>

              </component>

            </settings>

            <settings pass="specialize">

              <component
                name="Microsoft-Windows-Shell-Setup"
                processorArchitecture="amd64"
                publicKeyToken="31bf3856ad364e35"
                language="neutral"
                versionScope="nonSxS">

                <ComputerName>WIN11-RDP</ComputerName>

              </component>

            </settings>

            <settings pass="oobeSystem">

              <component
                name="Microsoft-Windows-International-Core"
                processorArchitecture="amd64"
                publicKeyToken="31bf3856ad364e35"
                language="neutral"
                versionScope="nonSxS">

                <InputLocale>en-US</InputLocale>
                <SystemLocale>en-US</SystemLocale>
                <UILanguage>en-US</UILanguage>
                <UserLocale>en-US</UserLocale>

              </component>

              <component
                name="Microsoft-Windows-Shell-Setup"
                processorArchitecture="amd64"
                publicKeyToken="31bf3856ad364e35"
                language="neutral"
                versionScope="nonSxS">

                <OOBE>

                  <HideEULAPage>true</HideEULAPage>
                  <HideOnlineAccountScreens>true</HideOnlineAccountScreens>
                  <HideOEMRegistrationScreen>true</HideOEMRegistrationScreen>
                  <HideWirelessSetupInOOBE>true</HideWirelessSetupInOOBE>

                  <ProtectYourPC>3</ProtectYourPC>

                  <SkipMachineOOBE>true</SkipMachineOOBE>
                  <SkipUserOOBE>true</SkipUserOOBE>

                </OOBE>

                <UserAccounts>

                  <LocalAccounts>

                    <LocalAccount wcm:action="add">

                      <Name>rdpuser</Name>
                      <DisplayName>RDP User</DisplayName>
                      <Description>Remote Desktop User</Description>
                      <Group>Administrators</Group>

                      <Password>
                        <Value>\${RDP_PASSWORD}</Value>
                        <PlainText>true</PlainText>
                      </Password>

                    </LocalAccount>

                  </LocalAccounts>

                </UserAccounts>

                <AutoLogon>

                  <Enabled>true</Enabled>
                  <Username>rdpuser</Username>
                  <LogonCount>5</LogonCount>

                  <Password>
                    <Value>\${RDP_PASSWORD}</Value>
                    <PlainText>true</PlainText>
                  </Password>

                </AutoLogon>

                <FirstLogonCommands>

                  <SynchronousCommand wcm:action="add">

                    <Order>1</Order>

                    <CommandLine>
                      powershell.exe -NoProfile -ExecutionPolicy Bypass -Command "Set-Service -Name TermService -StartupType Automatic"
                    </CommandLine>

                    <Description>Enable Remote Desktop service</Description>

                  </SynchronousCommand>

                  <SynchronousCommand wcm:action="add">

                    <Order>2</Order>

                    <CommandLine>
                      powershell.exe -NoProfile -ExecutionPolicy Bypass -Command "Set-ItemProperty -Path 'HKLM:\SYSTEM\CurrentControlSet\Control\Terminal Server' -Name fDenyTSConnections -Value 0"
                    </CommandLine>

                    <Description>Enable Remote Desktop</Description>

                  </SynchronousCommand>

                  <SynchronousCommand wcm:action="add">

                    <Order>3</Order>

                    <CommandLine>
                      powershell.exe -NoProfile -ExecutionPolicy Bypass -Command "Set-ItemProperty
