name: Temporary Windows 11 RDP

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  windows-vm:
    runs-on: ubuntu-24.04
    timeout-minutes: 350

    steps:

      - name: Check host
        shell: bash
        run: |
          set -euxo pipefail

          echo "===== SYSTEM ====="
          uname -a

          echo
          echo "===== ARCHITECTURE ====="
          uname -m
          dpkg --print-architecture

          echo
          echo "===== CPU ====="
          lscpu

          echo
          echo "===== MEMORY ====="
          free -h

          echo
          echo "===== KVM ====="

          if [ -e /dev/kvm ] && [ -r /dev/kvm ] && [ -w /dev/kvm ]; then
            echo "KVM device exists and is accessible."
          else
            echo "KVM unavailable. Software emulation will be used."
          fi


      - name: Install virtualization software
        shell: bash
        run: |
          set -euxo pipefail

          sudo apt-get update

          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y \
            qemu-system-x86 \
            qemu-utils \
            ovmf \
            swtpm \
            swtpm-tools \
            xorriso \
            curl \
            wget \
            ca-certificates \
            netcat-openbsd \
            socat \
            iproute2 \
            lsof \
            procps


      - name: Verify QEMU
        shell: bash
        run: |
          set -euxo pipefail

          echo "===== QEMU ====="
          qemu-system-x86_64 --version

          echo
          echo "===== QEMU IMAGE ====="
          qemu-img --version

          echo
          echo "===== TPM ====="
          swtpm --version || true

          echo
          echo "===== UEFI ====="
          ls -lh /usr/share/OVMF/

          echo
          echo "===== QEMU LIBRARIES ====="
          ldd "$(command -v qemu-system-x86_64)" | tee /tmp/qemu-ldd.txt

          if grep -q "not found" /tmp/qemu-ldd.txt; then
            echo "::error::QEMU has missing libraries."
            exit 1
          fi


      - name: Download Windows ISO
        shell: bash
        env:
          WINDOWS_ISO_URL: ${{ secrets.WINDOWS_ISO_URL }}
        run: |
          set -euo pipefail

          if [ -z "${WINDOWS_ISO_URL:-}" ]; then
            echo "::error::WINDOWS_ISO_URL secret is missing."
            exit 1
          fi

          case "$WINDOWS_ISO_URL" in
            https://software.download.prss.microsoft.com/*)
              echo "Microsoft ISO URL detected."
              ;;
            *)
              echo "::error::The ISO URL is not a Microsoft download URL."
              exit 1
              ;;
          esac

          mkdir -p "$RUNNER_TEMP/windows"

          echo "Downloading Windows ISO..."

          curl \
            --fail \
            --location \
            --retry 5 \
            --retry-delay 5 \
            --connect-timeout 30 \
            --output "$RUNNER_TEMP/windows/windows.iso" \
            "$WINDOWS_ISO_URL"

          test -s "$RUNNER_TEMP/windows/windows.iso"

          echo
          echo "ISO downloaded successfully."

          du -h "$RUNNER_TEMP/windows/windows.iso"

          echo
          echo "SHA256:"
          sha256sum "$RUNNER_TEMP/windows/windows.iso"


      - name: Prepare VM
        shell: bash
        run: |
          set -euxo pipefail

          VM="$RUNNER_TEMP/windows-vm"

          mkdir -p "$VM"
          mkdir -p "$VM/tpm"

          echo "Creating virtual disk..."

          qemu-img create \
            -f qcow2 \
            "$VM/windows.qcow2" \
            50G

          echo "Creating UEFI variables..."

          cp \
            /usr/share/OVMF/OVMF_VARS_4M.fd \
            "$VM/OVMF_VARS.fd"

          chmod 600 "$VM/OVMF_VARS.fd"

          echo "VM disk ready."


      - name: Start virtual TPM
        shell: bash
        run: |
          set -euxo pipefail

          VM="$RUNNER_TEMP/windows-vm"

          TPM_SOCKET="$VM/tpm/swtpm.sock"

          rm -f "$TPM_SOCKET"

          echo "Starting TPM 2.0..."

          swtpm socket \
            --tpm2 \
            --tpmstate dir="$VM/tpm" \
            --ctrl type=unixio,path="$TPM_SOCKET" \
            --log level=20 \
            --daemon

          sleep 3

          if [ ! -S "$TPM_SOCKET" ]; then
            echo "::error::TPM socket was not created."

            ls -la "$VM/tpm"

            exit 1
          fi

          echo "TPM 2.0 started."


      - name: Select acceleration
        shell: bash
        run: |
          set -euo pipefail

          if [ -e /dev/kvm ] && \
             [ -r /dev/kvm ] && \
             [ -w /dev/kvm ]; then

            echo "Testing KVM..."

            if timeout 5 bash -c 'exec 3<>/dev/kvm'; then
              echo "KVM is usable."

              echo "QEMU_ACCEL=-enable-kvm" >> "$GITHUB_ENV"
              echo "QEMU_CPU=host" >> "$GITHUB_ENV"

            else
              echo "KVM cannot be opened."
              echo "Using software emulation."

              echo "QEMU_ACCEL=-accel tcg,thread=multi" >> "$GITHUB_ENV"
              echo "QEMU_CPU=max" >> "$GITHUB_ENV"
            fi

          else
            echo "KVM unavailable."
            echo "Using software emulation."

            echo "QEMU_ACCEL=-accel tcg,thread=multi" >> "$GITHUB_ENV"
            echo "QEMU_CPU=max" >> "$GITHUB_ENV"
          fi


      - name: Start Windows VM
        shell: bash
        run: |
          set -euo pipefail

          VM="$RUNNER_TEMP/windows-vm"

          TPM_SOCKET="$VM/tpm/swtpm.sock"

          echo "Starting real Windows 11 VM..."

          qemu-system-x86_64 \
            $QEMU_ACCEL \
            -machine q35 \
            -cpu "$QEMU_CPU" \
            -smp 2 \
            -m 6G \
            \
            -drive if=pflash,format=raw,readonly=on,file=/usr/share/OVMF/OVMF_CODE_4M.fd \
            -drive if=pflash,format=raw,file="$VM/OVMF_VARS.fd" \
            \
            -drive file="$VM/windows.qcow2",format=qcow2,if=ide \
            \
            -cdrom "$RUNNER_TEMP/windows/windows.iso" \
            \
            -chardev socket,id=chrtpm,path="$TPM_SOCKET" \
            -tpmdev emulator,id=tpm0,chardev=chrtpm \
            -device tpm-tis,tpmdev=tpm0 \
            \
            -nic user,model=e1000,hostfwd=tcp:127.0.0.1:3389-:3389 \
            \
            -display none \
            -nodefaults \
            -serial file:"$VM/qemu-serial.log" \
            -monitor file:"$VM/qemu-monitor.log" \
            -pidfile "$VM/qemu.pid" \
            -daemonize

          sleep 5

          if [ ! -f "$VM/qemu.pid" ]; then
            echo "::error::QEMU did not start."
            exit 1
          fi

          PID="$(cat "$VM/qemu.pid")"

          if ! kill -0 "$PID" 2>/dev/null; then
            echo "::error::QEMU died."

            echo
            echo "===== SERIAL LOG ====="
            cat "$VM/qemu-serial.log" || true

            echo
            echo "===== MONITOR LOG ====="
            cat "$VM/qemu-monitor.log" || true

            exit 1
          fi

          echo
          echo "======================================"
          echo "QEMU STARTED SUCCESSFULLY"
          echo "======================================"
          echo "PID: $PID"


      - name: Check VM
        shell: bash
        run: |
          set -euo pipefail

          VM="$RUNNER_TEMP/windows-vm"

          echo "Checking QEMU..."

          for i in $(seq 1 12); do

            if kill -0 "$(cat "$VM/qemu.pid")" 2>/dev/null; then
              echo "QEMU is alive."

              sleep 5
            else
              echo "::error::QEMU stopped."

              echo
              echo "===== SERIAL LOG ====="
              cat "$VM/qemu-serial.log" || true

              exit 1
            fi

          done

          echo
          echo "Windows VM survived the startup test."


      - name: Debug information
        if: always()
        shell: bash
        run: |
          set +e

          VM="$RUNNER_TEMP/windows-vm"

          echo "===== VM FILES ====="
          ls -lah "$VM" 2>/dev/null || true

          echo
          echo "===== TPM ====="
          ls -lah "$VM/tpm" 2>/dev/null || true

          echo
          echo "===== QEMU SERIAL ====="
          cat "$VM/qemu-serial.log" 2>/dev/null || true

          echo
          echo "===== QEMU MONITOR ====="
          cat "$VM/qemu-monitor.log" 2>/dev/null || true

          echo
          echo "===== PROCESSES ====="
          ps aux | grep -E 'qemu|swtpm' | grep -v grep || true


      - name: Cleanup
        if: always()
        shell: bash
        run: |
          set +e

          VM="$RUNNER_TEMP/windows-vm"

          if [ -f "$VM/qemu.pid" ]; then
            kill "$(cat "$VM/qemu.pid")" 2>/dev/null || true
          fi

          pkill -f swtpm 2>/dev/null || true

          echo "Cleanup complete."
