name: Windows 11 RDP

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  windows:
    runs-on: ubuntu-24.04
    timeout-minutes: 350

    steps:

      - name: Install tools
        run: |
          set -euxo pipefail

          sudo apt-get update

          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y \
            qemu-system-x86 \
            qemu-utils \
            ovmf \
            swtpm \
            swtpm-tools \
            xorriso \
            wimtools \
            7zip \
            curl \
            wget \
            netcat-openbsd \
            socat

      - name: Check disk space
        run: |
          set -euxo pipefail

          echo "===== DISK ====="
          df -h

          echo
          echo "===== MEMORY ====="
          free -h

          echo
          echo "===== CPU ====="
          nproc

      - name: Download Windows ISO
        env:
          WINDOWS_ISO_URL: ${{ secrets.WINDOWS_ISO_URL }}
        run: |
          set -euo pipefail

          if [ -z "${WINDOWS_ISO_URL:-}" ]; then
            echo "::error::WINDOWS_ISO_URL is missing."
            exit 1
          fi

          case "$WINDOWS_ISO_URL" in
            https://software.download.prss.microsoft.com/*)
              echo "Official Microsoft ISO URL detected."
              ;;
            *)
              echo "::error::WINDOWS_ISO_URL is not a Microsoft download URL."
              exit 1
              ;;
          esac

          mkdir -p "$RUNNER_TEMP/windows"

          curl \
            --fail \
            --location \
            --retry 5 \
            --retry-delay 5 \
            --connect-timeout 30 \
            -o "$RUNNER_TEMP/windows/windows.iso" \
            "$WINDOWS_ISO_URL"

          test -s "$RUNNER_TEMP/windows/windows.iso"

          echo "Windows ISO downloaded:"
          du -h "$RUNNER_TEMP/windows/windows.iso"

      - name: Find Windows image
        run: |
          set -euxo pipefail

          ISO="$RUNNER_TEMP/windows/windows.iso"
          WORK="$RUNNER_TEMP/windows"

          mkdir -p "$WORK/iso"

          echo "Reading ISO..."

          7z x "$ISO" -o"$WORK/iso" >/dev/null

          if [ -f "$WORK/iso/sources/install.wim" ]; then
            WIM="$WORK/iso/sources/install.wim"
          elif [ -f "$WORK/iso/sources/install.esd" ]; then
            WIM="$WORK/iso/sources/install.esd"
          else
            echo "::error::Could not find install.wim or install.esd."
            exit 1
          fi

          echo "Windows image:"
          echo "$WIM"

          echo
          echo "===== WINDOWS EDITIONS ====="

          wimlib-imagex info "$WIM"

          echo
          echo "Finding Windows 11 Pro..."

          INDEX="$(
            wimlib-imagex info "$WIM" |
            awk '
              /^Index:/ {
                index=$2
              }

              /^Name:/ {
                name=$0
                sub(/^Name:[[:space:]]*/, "", name)

                if (name == "Windows 11 Pro") {
                  print index
                  exit
                }
              }
            '
          )"

          if [ -z "$INDEX" ]; then
            echo "::error::Windows 11 Pro was not found in the ISO."
            exit 1
          fi

          echo "Windows 11 Pro index: $INDEX"

          echo "WINDOWS_IMAGE_INDEX=$INDEX" >> "$GITHUB_ENV"
          echo "WINDOWS_IMAGE_FILE=$WIM" >> "$GITHUB_ENV"

      - name: Create unattended installer
        env:
          RDP_PASSWORD: ${{ secrets.RDP_PASSWORD }}
        run: |
          set -euo pipefail

          if [ -z "${RDP_PASSWORD:-}" ]; then
            echo "::error::RDP_PASSWORD is missing."
            exit 1
          fi

          echo "::add-mask::$RDP_PASSWORD"

          WORK="$RUNNER_TEMP/windows"
          ANSWER="$WORK/Autounattend.xml"

          cat > "$ANSWER" <<EOF
          <?xml version="1.0" encoding="utf-8"?>
          <unattend xmlns="urn:schemas-microsoft-com:unattend">

            <settings pass="windowsPE">

              <component
                name="Microsoft-Windows-International-Core-WinPE"
                processorArchitecture="amd64"
                publicKeyToken="31bf3856ad364e35"
                language="neutral"
                versionScope="nonSxS">

                <SetupUILanguage>
                  <UILanguage>en-US</UILanguage>
                </SetupUILanguage>

                <InputLocale>en-US</InputLocale>
                <SystemLocale>en-US</SystemLocale>
                <UILanguage>en-US</UILanguage>
                <UserLocale>en-US</UserLocale>

              </component>

              <component
                name="Microsoft-Windows-Setup"
                processorArchitecture="amd64"
                publicKeyToken="31bf3856ad364e35"
                language="neutral"
                versionScope="nonSxS">

                <DiskConfiguration>

                  <Disk wcm:action="add"
                    xmlns:wcm="http://schemas.microsoft.com/WMIConfig/2002/State">

                    <DiskID>0</DiskID>
                    <WillWipeDisk>true</WillWipeDisk>

                    <CreatePartitions>

                      <CreatePartition wcm:action="add">
                        <Order>1</Order>
                        <Type>EFI</Type>
                        <Size>100</Size>
                      </CreatePartition>

                      <CreatePartition wcm:action="add">
                        <Order>2</Order>
                        <Type>MSR</Type>
                        <Size>16</Size>
                      </CreatePartition>

                      <CreatePartition wcm:action="add">
                        <Order>3</Order>
                        <Type>Primary</Type>
                        <Extend>true</Extend>
                      </CreatePartition>

                    </CreatePartitions>

                    <ModifyPartitions>

                      <ModifyPartition wcm:action="add">
                        <Order>1</Order>
                        <PartitionID>1</PartitionID>
                        <Format>FAT32</Format>
                        <Label>System</Label>
                      </ModifyPartition>

                      <ModifyPartition wcm:action="add">
                        <Order>2</Order>
                        <PartitionID>2</PartitionID>
                      </ModifyPartition>

                      <ModifyPartition wcm:action="add">
                        <Order>3</Order>
                        <PartitionID>3</PartitionID>
                        <Format>NTFS</Format>
                        <Label>Windows</Label>
                        <Letter>C</Letter>
                      </ModifyPartition>

                    </ModifyPartitions>

                  </Disk>

                  <WillShowUI>OnError</WillShowUI>

                </DiskConfiguration>

                <ImageInstall>

                  <OSImage>

                    <InstallFrom>

                      <MetaData
                        wcm:action="add"
                        xmlns:wcm="http://schemas.microsoft.com/WMIConfig/2002/State">

                        <Key>/IMAGE/INDEX</Key>
                        <Value>${WINDOWS_IMAGE_INDEX}</Value>

                      </MetaData>

                    </InstallFrom>

                    <InstallTo>

                      <DiskID>0</DiskID>
                      <PartitionID>3</PartitionID>

                    </InstallTo>

                    <WillShowUI>OnError</WillShowUI>

                  </OSImage>

                </ImageInstall>

                <UserData>

                  <AcceptEula>true</AcceptEula>

                  <ProductKey>

                    <WillShowUI>OnError</WillShowUI>

                  </ProductKey>

                </UserData>

              </component>

            </settings>

            <settings pass="specialize">

              <component
                name="Microsoft-Windows-TerminalServices-LocalSessionManager"
                processorArchitecture="amd64"
                publicKeyToken="31bf3856ad364e35"
                language="neutral"
                versionScope="nonSxS">

                <fDenyTSConnections>false</fDenyTSConnections>

              </component>

              <component
                name="Microsoft-Windows-TerminalServices-RDP-WinStation"
                processorArchitecture="amd64"
                publicKeyToken="31bf3856ad364e35"
                language="neutral"
                versionScope="nonSxS">

                <UserAuthentication>1</UserAuthentication>

              </component>

              <component
                name="Microsoft-Windows-Deployment"
                processorArchitecture="amd64"
                publicKeyToken="31bf3856ad364e35"
                language="neutral"
                versionScope="nonSxS">

                <RunSynchronous>

                  <RunSynchronousCommand wcm:action="add"
                    xmlns:wcm="http://schemas.microsoft.com/WMIConfig/2002/State">

                    <Order>1</Order>

                    <Path>
                      cmd /c "reg add HKLM\SYSTEM\CurrentControlSet\Control\Terminal Server /v fDenyTSConnections /t REG_DWORD /d 0 /f"
                    </Path>

                  </RunSynchronousCommand>

                  <RunSynchronousCommand wcm:action="add"
                    xmlns:wcm="http://schemas.microsoft.com/WMIConfig/2002/State">

                    <Order>2</Order>

                    <Path>
                      cmd /c "netsh advfirewall firewall set rule group=\"remote desktop\" new enable=Yes"
                    </Path>

                  </RunSynchronousCommand>

                  <RunSynchronousCommand wcm:action="add"
                    xmlns:wcm="http://schemas.microsoft.com/WMIConfig/2002/State">

                    <Order>3</Order>

                    <Path>
                      cmd /c "sc config TermService start= auto"
                    </Path>

                  </RunSynchronousCommand>

                  <RunSynchronousCommand wcm:action="add"
                    xmlns:wcm="http://schemas.microsoft.com/WMIConfig/2002/State">

                    <Order>4</Order>

                    <Path>
                      cmd /c "net start TermService"
                    </Path>

                  </RunSynchronousCommand>

                </RunSynchronous>

              </component>

            </settings>

            <settings pass="oobeSystem">

              <component
                name="Microsoft-Windows-Shell-Setup"
                processorArchitecture="amd64"
                publicKeyToken="31bf3856ad364e35"
                language="neutral"
                versionScope="nonSxS">

                <OOBE>

                  <HideEULAPage>true</HideEULAPage>
                  <HideOnlineAccountScreens>true</HideOnlineAccountScreens>
                  <HideWirelessSetupInOOBE>true</HideWirelessSetupInOOBE>
                  <ProtectYourPC>3</ProtectYourPC>

                </OOBE>

                <UserAccounts>

                  <LocalAccounts>

                    <LocalAccount wcm:action="add"
                      xmlns:wcm="http://schemas.microsoft.com/WMIConfig/2002/State">

                      <Name>rdpuser</Name>

                      <DisplayName>RDP User</DisplayName>

                      <Group>Administrators</Group>

                      <Password>
                        <Value>${RDP_PASSWORD}</Value>
                        <PlainText>true</PlainText>
                      </Password>

                    </LocalAccount>

                  </LocalAccounts>

                </UserAccounts>

                <RegisteredOwner>RDP User</RegisteredOwner>

                <TimeZone>Pakistan Standard Time</TimeZone>

              </component>

            </settings>

          </unattend>
          EOF

          echo "Autounattend.xml created."

          xmllint --noout "$ANSWER" || {
            echo "::error::Autounattend.xml is invalid XML."
            exit 1
          }

      - name: Create unattended ISO
        run: |
          set -euxo pipefail

          WORK="$RUNNER_TEMP/windows"

          mkdir -p "$WORK/unattended"

          cp "$WORK/Autounattend.xml" "$WORK/unattended/Autounattend.xml"

          xorriso \
            -as mkisofs \
            -iso-level 3 \
            -J \
            -R \
            -V "UNATTENDED" \
            -o "$WORK/unattended.iso" \
            "$WORK/unattended"

          ls -lh "$WORK/unattended.iso"

      - name: Prepare VM
        run: |
          set -euxo pipefail

          WORK="$RUNNER_TEMP/windows"
          VM="$WORK/vm"

          mkdir -p "$VM"
          mkdir -p "$VM/tpm"

          echo "Creating 50 GB virtual disk..."

          qemu-img create \
            -f qcow2 \
            "$VM/windows.qcow2" \
            50G

          echo "Creating UEFI variables..."

          cp \
            /usr/share/OVMF/OVMF_VARS_4M.fd \
            "$VM/OVMF_VARS.fd"

          chmod 600 "$VM/OVMF_VARS.fd"

      - name: Start TPM
        run: |
          set -euxo pipefail

          VM="$RUNNER_TEMP/windows/vm"

          swtpm socket \
            --tpm2 \
            --tpmstate dir="$VM/tpm" \
            --ctrl type=unixio,path="$VM/tpm/swtpm.sock" \
            --log level=20 \
            --daemon

          sleep 3

          test -S "$VM/tpm/swtpm.sock"

          echo "TPM 2.0 is running."

      - name: Select QEMU acceleration
        run: |
          set -euo pipefail

          if [ -r /dev/kvm ] && [ -w /dev/kvm ]; then

            if timeout 5 bash -c 'exec 3<>/dev/kvm'; then
              echo "KVM is available."
              echo "QEMU_ACCEL=-enable-kvm" >> "$GITHUB_ENV"
              echo "QEMU_CPU=host" >> "$GITHUB_ENV"
            else
              echo "KVM exists but cannot be used."
              echo "QEMU_ACCEL=-accel tcg,thread=multi" >> "$GITHUB_ENV"
              echo "QEMU_CPU=max" >> "$GITHUB_ENV"
            fi

          else

            echo "KVM unavailable."
            echo "Using software emulation."

            echo "QEMU_ACCEL=-accel tcg,thread=multi" >> "$GITHUB_ENV"
            echo "QEMU_CPU=max" >> "$GITHUB_ENV"

          fi

      - name: Boot Windows installer
        run: |
          set -euo pipefail

          VM="$RUNNER_TEMP/windows/vm"
          WIN="$RUNNER_TEMP/windows"

          echo "Starting Windows 11 installation..."

          qemu-system-x86_64 \
            $QEMU_ACCEL \
            -machine q35 \
            -cpu "$QEMU_CPU" \
            -smp 2 \
            -m 6G \
            \
            -drive if=pflash,format=raw,readonly=on,file=/usr/share/OVMF/OVMF_CODE_4M.fd \
            -drive if=pflash,format=raw,file="$VM/OVMF_VARS.fd" \
            \
            -drive file="$VM/windows.qcow2",format=qcow2,if=ide \
            \
            -drive file="$WIN/windows.iso",media=cdrom,readonly=on \
            -drive file="$WIN/unattended.iso",media=cdrom,readonly=on \
            \
            -chardev socket,id=chrtpm,path="$VM/tpm/swtpm.sock" \
            -tpmdev emulator,id=tpm0,chardev=chrtpm \
            -device tpm-tis,tpmdev=tpm0 \
            \
            -nic user,model=e1000,hostfwd=tcp:127.0.0.1:3389-:3389 \
            \
            -display none \
            -serial file:"$VM/serial.log" \
            -monitor file:"$VM/monitor.log" \
            -pidfile "$VM/qemu.pid" \
            -daemonize

          sleep 10

          if ! kill -0 "$(cat "$VM/qemu.pid")" 2>/dev/null; then
            echo "::error::QEMU stopped."

            echo "===== SERIAL ====="
            cat "$VM/serial.log" || true

            echo "===== MONITOR ====="
            cat "$VM/monitor.log" || true

            exit 1
          fi

          echo "Windows installation VM is running."

      - name: Wait for Windows installation
        run: |
          set -euo pipefail

          VM="$RUNNER_TEMP/windows/vm"

          echo "Waiting for Windows to finish installing..."

          for i in $(seq 1 60); do

            if ! kill -0 "$(cat "$VM/qemu.pid")" 2>/dev/null; then
              echo "::error::Windows VM stopped during installation."

              echo "===== SERIAL ====="
              cat "$VM/serial.log" || true

              exit 1
            fi

            echo "Installation still running... $((i * 30)) seconds"

            sleep 30

          done

          echo "Windows installation wait completed."

      - name: Check RDP
        run: |
          set -euo pipefail

          echo "Checking local RDP forwarding..."

          for i in $(seq 1 20); do

            if nc -z 127.0.0.1 3389; then
              echo "RDP port is OPEN."
              echo "Windows RDP is reachable."
              exit 0
            fi

            echo "RDP not ready yet..."
            sleep 15

          done

          echo "::warning::RDP port did not become reachable during this test."

      - name: VM status
        if: always()
        run: |
          set +e

          VM="$RUNNER_TEMP/windows/vm"

          echo "===== VM FILES ====="
          ls -lah "$VM" || true

          echo
          echo "===== PROCESSES ====="
          ps aux | grep -E 'qemu|swtpm' | grep -v grep || true

          echo
          echo "===== SERIAL ====="
          cat "$VM/serial.log" 2>/dev/null || true

          echo
          echo "===== MONITOR ====="
          cat "$VM/monitor.log" 2>/dev/null || true

          echo
          echo "===== DISK ====="
          qemu-img info "$VM/windows.qcow2" || true

      - name: Cleanup
        if: always()
        run: |
          set +e

          VM="$RUNNER_TEMP/windows/vm"

          if [ -f "$VM/qemu.pid" ]; then
            kill "$(cat "$VM/qemu.pid")" 2>/dev/null || true
          fi

          pkill -f swtpm 2>/dev/null || true

          echo "Cleanup complete."
