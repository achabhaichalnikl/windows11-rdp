name: Windows 11 Browser VM

on:
  workflow_dispatch:

jobs:
  windows-browser-vm:
    runs-on: ubuntu-24.04
    timeout-minutes: 350

    steps:

      # ============================================================
      # INSTALL EVERYTHING
      # ============================================================
      - name: Install required packages
        run: |
          set -euxo pipefail

          sudo apt-get update

          sudo apt-get install -y \
            qemu-system-x86 \
            qemu-utils \
            ovmf \
            swtpm \
            swtpm-tools \
            xorriso \
            wimtools \
            p7zip-full \
            curl \
            wget \
            git \
            python3 \
            python3-websockify \
            netcat-openbsd

          echo
          echo "=============================================="
          echo "SOFTWARE INSTALLED"
          echo "=============================================="

          qemu-system-x86_64 --version
          qemu-img --version
          wimlib-imagex --version
          websockify --version || true


      # ============================================================
      # PREPARE WORKSPACE
      # ============================================================
      - name: Prepare workspace
        run: |
          set -euxo pipefail

          rm -rf "$HOME/windows-browser"

          mkdir -p \
            "$HOME/windows-browser/iso" \
            "$HOME/windows-browser/work" \
            "$HOME/windows-browser/autounattend"

          echo
          echo "Disk space:"
          df -h "$HOME"


      # ============================================================
      # DOWNLOAD WINDOWS
      # ============================================================
      - name: Download official Microsoft Windows ISO
        env:
          WINDOWS_ISO_URL: ${{ secrets.WINDOWS_ISO_URL }}
        run: |
          set -euxo pipefail

          if [ -z "${WINDOWS_ISO_URL:-}" ]; then
            echo "ERROR: WINDOWS_ISO_URL secret is missing."
            exit 1
          fi

          echo
          echo "=============================================="
          echo "DOWNLOADING WINDOWS 11"
          echo "=============================================="

          curl \
            -L \
            --fail \
            --retry 5 \
            --retry-delay 5 \
            --connect-timeout 30 \
            -o "$HOME/windows-browser/windows.iso" \
            "$WINDOWS_ISO_URL"

          ls -lh "$HOME/windows-browser/windows.iso"


      # ============================================================
      # EXTRACT WINDOWS ISO
      # ============================================================
      - name: Extract Windows ISO
        run: |
          set -euxo pipefail

          7z x \
            "$HOME/windows-browser/windows.iso" \
            -o"$HOME/windows-browser/iso" \
            -y

          echo
          echo "Windows sources:"
          ls -lh "$HOME/windows-browser/iso/sources"


      # ============================================================
      # DETECT WINDOWS 11 PRO
      # ============================================================
      - name: Detect Windows 11 Pro index
        run: |
          set -euxo pipefail

          WIM="$HOME/windows-browser/iso/sources/install.wim"
          INFO="$HOME/windows-browser/work/wim-info.txt"

          if [ ! -f "$WIM" ]; then
            echo "ERROR: install.wim not found."
            exit 1
          fi

          wimlib-imagex info "$WIM" > "$INFO"

          echo
          echo "=============================================="
          echo "WINDOWS EDITIONS"
          echo "=============================================="

          cat "$INFO"

          PRO_INDEX="$(
            python3 - "$INFO" <<'PY'
          import sys
          import re

          path = sys.argv[1]

          with open(path, "r", encoding="utf-8", errors="ignore") as f:
              text = f.read()

          blocks = re.split(r'\n(?=Index:\s*\d+)', text)

          found = None

          for block in blocks:

              m = re.search(r'Index:\s*(\d+)', block)

              if not m:
                  continue

              idx = m.group(1)

              nm = re.search(
                  r'(?m)^Name:\s*(.+?)\s*$',
                  block
              )

              if not nm:
                  continue

              name = nm.group(1).strip().lower()

              if name == "windows 11 pro":
                  found = idx
                  break

              if name.endswith("windows 11 pro"):
                  found = idx
                  break

          print(found if found else "NOT_FOUND")
          PY
          )"

          echo
          echo "Windows 11 Pro index: $PRO_INDEX"

          if [ "$PRO_INDEX" = "NOT_FOUND" ]; then
            echo "ERROR: Windows 11 Pro was not found."
            exit 1
          fi

          echo "$PRO_INDEX" > \
            "$HOME/windows-browser/work/pro-index.txt"


      # ============================================================
      # CREATE WINDOWS UNATTENDED INSTALL
      # ============================================================
      - name: Create Autounattend.xml
        env:
          RDP_PASSWORD: ${{ secrets.RDP_PASSWORD }}
        run: |
          set -euxo pipefail

          if [ -z "${RDP_PASSWORD:-}" ]; then
            echo "ERROR: RDP_PASSWORD secret is missing."
            exit 1
          fi

          case "$RDP_PASSWORD" in
            *'<'*|*'>'*|*'&'*|*'"'*)
              echo "ERROR: Password contains XML-special characters."
              echo "Use a password without < > & or double quotes."
              exit 1
              ;;
          esac

          PRO_INDEX="$(cat "$HOME/windows-browser/work/pro-index.txt")"

          cat > "$HOME/windows-browser/autounattend/Autounattend.xml" <<XML
          <?xml version="1.0" encoding="utf-8"?>

          <unattend
            xmlns="urn:schemas-microsoft-com:unattend"
            xmlns:wcm="http://schemas.microsoft.com/WMIConfig/2002/State">

            <settings pass="windowsPE">

              <component
                name="Microsoft-Windows-International-Core-WinPE"
                processorArchitecture="amd64"
                publicKeyToken="31bf3856ad364e35"
                language="neutral"
                versionScope="nonSxS">

                <SetupUILanguage>
                  <UILanguage>en-US</UILanguage>
                </SetupUILanguage>

                <InputLocale>en-US</InputLocale>
                <SystemLocale>en-US</SystemLocale>
                <UILanguage>en-US</UILanguage>
                <UserLocale>en-US</UserLocale>

              </component>

              <component
                name="Microsoft-Windows-Setup"
                processorArchitecture="amd64"
                publicKeyToken="31bf3856ad364e35"
                language="neutral"
                versionScope="nonSxS">

                <DiskConfiguration>

                  <Disk wcm:action="add">

                    <DiskID>0</DiskID>
                    <WillWipeDisk>true</WillWipeDisk>

                    <CreatePartitions>

                      <CreatePartition wcm:action="add">
                        <Order>1</Order>
                        <Size>100</Size>
                        <Type>EFI</Type>
                      </CreatePartition>

                      <CreatePartition wcm:action="add">
                        <Order>2</Order>
                        <Size>16</Size>
                        <Type>MSR</Type>
                      </CreatePartition>

                      <CreatePartition wcm:action="add">
                        <Order>3</Order>
                        <Extend>true</Extend>
                        <Type>Primary</Type>
                      </CreatePartition>

                    </CreatePartitions>

                    <ModifyPartitions>

                      <ModifyPartition wcm:action="add">
                        <Order>1</Order>
                        <PartitionID>1</PartitionID>
                        <Format>FAT32</Format>
                        <Label>System</Label>
                      </ModifyPartition>

                      <ModifyPartition wcm:action="add">
                        <Order>2</Order>
                        <PartitionID>2</PartitionID>
                      </ModifyPartition>

                      <ModifyPartition wcm:action="add">
                        <Order>3</Order>
                        <PartitionID>3</PartitionID>
                        <Format>NTFS</Format>
                        <Label>Windows</Label>
                        <Letter>C</Letter>
                      </ModifyPartition>

                    </ModifyPartitions>

                  </Disk>

                  <WillShowUI>OnError</WillShowUI>

                </DiskConfiguration>

                <ImageInstall>

                  <OSImage>

                    <InstallFrom>

                      <MetaData wcm:action="add">
                        <Key>/IMAGE/INDEX</Key>
                        <Value>${PRO_INDEX}</Value>
                      </MetaData>

                    </InstallFrom>

                    <InstallTo>
                      <DiskID>0</DiskID>
                      <PartitionID>3</PartitionID>
                    </InstallTo>

                    <WillShowUI>OnError</WillShowUI>

                  </OSImage>

                </ImageInstall>

                <UserData>

                  <AcceptEula>true</AcceptEula>

                  <ProductKey>

                    <Key>VK7JG-NPHTM-C97JM-9MPGT-3V66T</Key>

                    <WillShowUI>Never</WillShowUI>

                  </ProductKey>

                </UserData>

              </component>

            </settings>

            <settings pass="oobeSystem">

              <component
                name="Microsoft-Windows-International-Core"
                processorArchitecture="amd64"
                publicKeyToken="31bf3856ad364e35"
                language="neutral"
                versionScope="nonSxS">

                <InputLocale>en-US</InputLocale>
                <SystemLocale>en-US</SystemLocale>
                <UILanguage>en-US</UILanguage>
                <UserLocale>en-US</UserLocale>

              </component>

              <component
                name="Microsoft-Windows-Shell-Setup"
                processorArchitecture="amd64"
                publicKeyToken="31bf3856ad364e35"
                language="neutral"
                versionScope="nonSxS">

                <OOBE>

                  <HideEULAPage>true</HideEULAPage>
                  <HideOnlineAccountScreens>true</HideOnlineAccountScreens>
                  <HideOEMRegistrationScreen>true</HideOEMRegistrationScreen>
                  <HideWirelessSetupInOOBE>true</HideWirelessSetupInOOBE>

                  <ProtectYourPC>3</ProtectYourPC>

                  <SkipMachineOOBE>true</SkipMachineOOBE>
                  <SkipUserOOBE>true</SkipUserOOBE>

                </OOBE>

                <UserAccounts>

                  <LocalAccounts>

                    <LocalAccount wcm:action="add">

                      <Name>rdpuser</Name>

                      <DisplayName>Windows User</DisplayName>

                      <Group>Administrators</Group>

                      <Password>

                        <Value>\${RDP_PASSWORD}</Value>

                        <PlainText>true</PlainText>

                      </Password>

                    </LocalAccount>

                  </LocalAccounts>

                </UserAccounts>

                <AutoLogon>

                  <Enabled>true</Enabled>

                  <Username>rdpuser</Username>

                  <LogonCount>10</LogonCount>

                  <Password>

                    <Value>\${RDP_PASSWORD}</Value>

                    <PlainText>true</PlainText>

                  </Password>

                </AutoLogon>

              </component>

            </settings>

          </unattend>
          XML

          echo "Autounattend.xml created."


      # ============================================================
      # INSERT PASSWORD
      # ============================================================
      - name: Insert password
        env:
          RDP_PASSWORD: ${{ secrets.RDP_PASSWORD }}
        run: |
          set -euxo pipefail

          python3 - <<'PY'
          import os
          from pathlib import Path

          path = Path.home() / "windows-browser/autounattend/Autounattend.xml"

          text = path.read_text()

          password = os.environ["RDP_PASSWORD"]

          text = text.replace(
              r"\${RDP_PASSWORD}",
              password
          )

          path.write_text(text)

          print("Password inserted.")
          PY


      # ============================================================
      # CREATE ANSWER ISO
      # ============================================================
      - name: Create unattended ISO
        run: |
          set -euxo pipefail

          xorriso \
            -as mkisofs \
            -iso-level 3 \
            -V AUTOUNATTEND \
            -o "$HOME/windows-browser/work/autounattend.iso" \
            "$HOME/windows-browser/autounattend/Autounattend.xml"

          ls -lh "$HOME/windows-browser/work/autounattend.iso"


      # ============================================================
      # CREATE WINDOWS DISK
      # ============================================================
      - name: Create Windows virtual disk
        run: |
          set -euxo pipefail

          qemu-img create \
            -f qcow2 \
            "$HOME/windows-browser/work/windows.qcow2" \
            64G

          qemu-img info \
            "$HOME/windows-browser/work/windows.qcow2"


      # ============================================================
      # START TPM
      # ============================================================
      - name: Start TPM
        run: |
          set -euxo pipefail

          WORK="$HOME/windows-browser/work"

          mkdir -p "$WORK/tpm"

          swtpm socket \
            --tpm2 \
            --tpmstate dir="$WORK/tpm" \
            --ctrl type=unixio,path="$WORK/swtpm.sock" \
            --daemon

          sleep 2

          test -S "$WORK/swtpm.sock"

          echo "TPM 2.0 ready."


      # ============================================================
      # START WINDOWS WITH VNC
      # ============================================================
      - name: Start Windows VM with VNC
        run: |
          set -euxo pipefail

          WORK="$HOME/windows-browser/work"

          OVMF_CODE="/usr/share/OVMF/OVMF_CODE_4M.fd"
          OVMF_VARS="/usr/share/OVMF/OVMF_VARS_4M.fd"

          if [ ! -f "$OVMF_CODE" ]; then
            OVMF_CODE="/usr/share/OVMF/OVMF_CODE.fd"
          fi

          if [ ! -f "$OVMF_VARS" ]; then
            OVMF_VARS="/usr/share/OVMF/OVMF_VARS.fd"
          fi

          test -f "$OVMF_CODE"
          test -f "$OVMF_VARS"

          cp "$OVMF_VARS" "$WORK/OVMF_VARS.fd"

          echo
          echo "##################################################"
          echo "#                                                #"
          echo "#          STARTING WINDOWS 11 PRO               #"
          echo "#                                                #"
          echo "##################################################"
          echo

          qemu-system-x86_64 \
            -accel tcg,thread=multi \
            -machine q35 \
            -cpu max \
            -m 8G \
            -smp 4 \
            -drive if=pflash,format=raw,readonly=on,file="$OVMF_CODE" \
            -drive if=pflash,format=raw,file="$WORK/OVMF_VARS.fd" \
            -chardev socket,id=chrtpm,path="$WORK/swtpm.sock" \
            -tpmdev emulator,id=tpm0,chardev=chrtpm \
            -device tpm-tis,tpmdev=tpm0 \
            -drive file="$WORK/windows.qcow2",format=qcow2,if=ide \
            -drive file="$HOME/windows-browser/windows.iso",media=cdrom,readonly=on \
            -drive file="$WORK/autounattend.iso",media=cdrom,readonly=on \
            -netdev user,id=net0 \
            -device e1000,netdev=net0 \
            -vnc 127.0.0.1:0 \
            -display none \
            -serial file:"$WORK/qemu-serial.log" \
            -monitor unix:"$WORK/qemu-monitor.sock",server=on,wait=off \
            -pidfile "$WORK/qemu.pid" \
            -daemonize

          sleep 5

          QEMU_PID="$(cat "$WORK/qemu.pid")"

          if ! kill -0 "$QEMU_PID" 2>/dev/null; then
            echo "ERROR: QEMU stopped."

            cat "$WORK/qemu-serial.log" || true

            exit 1
          fi

          echo
          echo "WINDOWS VM STARTED"
          echo "QEMU PID: $QEMU_PID"
          echo "VNC: 127.0.0.1:5900"
          echo


      # ============================================================
      # WAIT FOR VNC
      # ============================================================
      - name: Wait for VNC
        run: |
          set -euxo pipefail

          echo
          echo "=============================================="
          echo "WAITING FOR QEMU VNC"
          echo "=============================================="

          READY=0

          for i in $(seq 1 120); do

            if nc -z 127.0.0.1 5900 2>/dev/null; then

              echo
              echo "VNC IS READY."
              READY=1
              break

            fi

            echo "Waiting for VNC... $i/120"

            sleep 2

          done

          if [ "$READY" -ne 1 ]; then

            echo
            echo "ERROR: VNC did not start."

            cat "$HOME/windows-browser/work/qemu-serial.log" || true

            exit 1

          fi


      # ============================================================
      # DOWNLOAD NOVNC
      # ============================================================
      - name: Install noVNC
        run: |
          set -euxo pipefail

          cd "$HOME/windows-browser/work"

          git clone \
            --depth 1 \
            https://github.com/novnc/noVNC.git \
            novnc

          echo
          echo "noVNC installed."

          ls "$HOME/windows-browser/work/novnc"


      # ============================================================
      # START NOVNC
      # ============================================================
      - name: Start noVNC
        run: |
          set -euxo pipefail

          WORK="$HOME/windows-browser/work"

          cd "$WORK/novnc"

          nohup ./utils/novnc_proxy \
            --vnc 127.0.0.1:5900 \
            --listen 127.0.0.1:6080 \
            > "$WORK/novnc.log" 2>&1 &

          NOVNC_PID=$!

          echo "$NOVNC_PID" > "$WORK/novnc.pid"

          sleep 5

          if ! kill -0 "$NOVNC_PID" 2>/dev/null; then

            echo "ERROR: noVNC failed."

            cat "$WORK/novnc.log" || true

            exit 1

          fi

          echo
          echo "noVNC IS RUNNING"
          echo "Local address: http://127.0.0.1:6080"
          echo


      # ============================================================
      # INSTALL CLOUDFLARED
      # ============================================================
      - name: Install Cloudflare tunnel
        run: |
          set -euxo pipefail

          wget \
            -q \
            https://github.com/cloudflare/cloudflared/releases/latest/download/cloudflared-linux-amd64.deb \
            -O "$HOME/cloudflared.deb"

          sudo dpkg -i "$HOME/cloudflared.deb"

          cloudflared --version


      # ============================================================
      # START PUBLIC BROWSER TUNNEL
      # ============================================================
      - name: Create public browser URL
        run: |
          set -euxo pipefail

          WORK="$HOME/windows-browser/work"

          echo
          echo "##################################################"
          echo "#                                                #"
          echo "#        CREATING PUBLIC BROWSER LINK            #"
          echo "#                                                #"
          echo "##################################################"
          echo

          nohup cloudflared tunnel \
            --no-autoupdate \
            --url http://127.0.0.1:6080 \
            > "$WORK/cloudflared.log" 2>&1 &

          CLOUDFLARED_PID=$!

          echo "$CLOUDFLARED_PID" > "$WORK/cloudflared.pid"

          URL=""

          for i in $(seq 1 60); do

            URL="$(
              grep -Eo \
              'https://[-a-zA-Z0-9]+\.trycloudflare\.com' \
              "$WORK/cloudflared.log" \
              | head -n 1 \
              || true
            )"

            if [ -n "$URL" ]; then
              break
            fi

            echo "Waiting for Cloudflare URL... $i/60"

            sleep 2

          done

          if [ -z "$URL" ]; then

            echo
            echo "ERROR: Cloudflare public URL was not created."
            echo

            cat "$WORK/cloudflared.log" || true

            exit 1

          fi

          echo "$URL" > "$WORK/browser-url.txt"

          echo
          echo
          echo "################################################################"
          echo "#                                                              #"
          echo "#              WINDOWS 11 BROWSER VM IS READY                  #"
          echo "#                                                              #"
          echo "################################################################"
          echo
          echo "OPEN THIS URL ON YOUR ANDROID PHONE:"
          echo
          echo "$URL/vnc.html?autoconnect=true&resize=remote"
          echo
          echo "################################################################"
          echo
          echo "REAL WINDOWS:"
          echo "Windows 11 Pro"
          echo
          echo "ACCESS:"
          echo "Chrome / Android browser"
          echo
          echo "NO RDP"
          echo "NO TAILSCALE"
          echo
          echo "################################################################"
          echo


      # ============================================================
      # KEEP EVERYTHING ALIVE
      # ============================================================
      - name: Keep Windows browser VM alive
        run: |
          set -euxo pipefail

          WORK="$HOME/windows-browser/work"

          URL="$(cat "$WORK/browser-url.txt")"

          echo
          echo
          echo "################################################################"
          echo "#                                                              #"
          echo "#                WINDOWS VM IS RUNNING                        #"
          echo "#                                                              #"
          echo "################################################################"
          echo
          echo "BROWSER URL:"
          echo
          echo "$URL/vnc.html?autoconnect=true&resize=remote"
          echo
          echo "Open that URL on your phone."
          echo
          echo "################################################################"
          echo

          while true; do

            QEMU_PID="$(cat "$WORK/qemu.pid")"

            if ! kill -0 "$QEMU_PID" 2>/dev/null; then
              echo "Windows VM stopped."
              cat "$WORK/qemu-serial.log" || true
              exit 1
            fi

            NOVNC_PID="$(cat "$WORK/novnc.pid")"

            if ! kill -0 "$NOVNC_PID" 2>/dev/null; then
              echo "noVNC stopped."
              cat "$WORK/novnc.log" || true
              exit 1
            fi

            CLOUDFLARED_PID="$(cat "$WORK/cloudflared.pid")"

            if ! kill -0 "$CLOUDFLARED_PID" 2>/dev/null; then
              echo "Cloudflare tunnel stopped."
              cat "$WORK/cloudflared.log" || true
              exit 1
            fi

            echo
            echo "============================================================"
            echo "WINDOWS VM : RUNNING"
            echo "BROWSER    : $URL/vnc.html?autoconnect=true&resize=remote"
            echo "============================================================"

            sleep 60

          done
