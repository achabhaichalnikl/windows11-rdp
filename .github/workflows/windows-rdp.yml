name: Windows Store Browser VM

on:
  workflow_dispatch:

jobs:
  windows-vm:
    runs-on: ubuntu-24.04
    timeout-minutes: 350

    steps:

      # ============================================================
      # INSTALL REQUIRED SOFTWARE
      # ============================================================
      - name: Install packages
        run: |
          set -euxo pipefail

          sudo apt-get update

          sudo apt-get install -y \
            qemu-system-x86 \
            qemu-utils \
            ovmf \
            swtpm \
            swtpm-tools \
            xorriso \
            wimtools \
            p7zip-full \
            curl \
            wget \
            git \
            python3 \
            python3-websockify \
            netcat-openbsd \
            socat

          echo "Everything installed."


      # ============================================================
      # WORKSPACE
      # ============================================================
      - name: Prepare workspace
        run: |
          set -euxo pipefail

          rm -rf "$HOME/windows-store"

          mkdir -p \
            "$HOME/windows-store/iso" \
            "$HOME/windows-store/work" \
            "$HOME/windows-store/answer"

          df -h "$HOME"


      # ============================================================
      # DOWNLOAD REAL MICROSOFT WINDOWS ISO
      # ============================================================
      - name: Download Microsoft Windows
        env:
          WINDOWS_ISO_URL: ${{ secrets.WINDOWS_ISO_URL }}
        run: |
          set -euxo pipefail

          if [ -z "${WINDOWS_ISO_URL:-}" ]; then
            echo "ERROR: WINDOWS_ISO_URL secret is missing."
            exit 1
          fi

          echo "Downloading Microsoft Windows ISO..."

          curl \
            -L \
            --fail \
            --retry 5 \
            --retry-delay 5 \
            --connect-timeout 30 \
            -o "$HOME/windows-store/windows.iso" \
            "$WINDOWS_ISO_URL"

          ls -lh "$HOME/windows-store/windows.iso"


      # ============================================================
      # INSPECT ISO
      # ============================================================
      - name: Inspect Windows ISO
        run: |
          set -euxo pipefail

          7z l "$HOME/windows-store/windows.iso" \
            | grep -E 'sources/(install.wim|install.esd)' \
            || true

          echo
          echo "ISO looks usable."


      # ============================================================
      # DETECT INSTALL IMAGE
      # ============================================================
      - name: Detect Windows image
        run: |
          set -euxo pipefail

          ISO="$HOME/windows-store/windows.iso"
          WORK="$HOME/windows-store/work"

          7z x "$ISO" \
            'sources/install.wim' \
            -o"$WORK/iso-check" \
            -y \
            || true

          if [ -f "$WORK/iso-check/sources/install.wim" ]; then

            echo "Found install.wim."

            wimlib-imagex info \
              "$WORK/iso-check/sources/install.wim" \
              > "$WORK/wim-info.txt"

            cat "$WORK/wim-info.txt"

          else

            echo "install.wim was not extracted."
            echo "The Windows ISO will still be booted normally."

          fi


      # ============================================================
      # CREATE WINDOWS ANSWER FILE
      #
      # The ISO remains untouched.
      # This simply tells Windows Setup:
      # - wipe the virtual disk
      # - install Windows
      # - create a local administrator
      #
      # Microsoft Store is NOT removed.
      # ============================================================
      - name: Create unattended installation
        env:
          RDP_PASSWORD: ${{ secrets.RDP_PASSWORD }}
        run: |
          set -euxo pipefail

          if [ -z "${RDP_PASSWORD:-}" ]; then
            echo "ERROR: RDP_PASSWORD secret is missing."
            exit 1
          fi

          case "$RDP_PASSWORD" in
            *'<'*|*'>'*|*'&'*|*'"'*)
              echo "ERROR: Password contains XML-special characters."
              echo "Use a password without < > & or double quotes."
              exit 1
              ;;
          esac

          cat > "$HOME/windows-store/answer/Autounattend.xml" <<XML
          <?xml version="1.0" encoding="utf-8"?>

          <unattend
            xmlns="urn:schemas-microsoft-com:unattend"
            xmlns:wcm="http://schemas.microsoft.com/WMIConfig/2002/State">

            <settings pass="windowsPE">

              <component
                name="Microsoft-Windows-International-Core-WinPE"
                processorArchitecture="amd64"
                publicKeyToken="31bf3856ad364e35"
                language="neutral"
                versionScope="nonSxS">

                <SetupUILanguage>
                  <UILanguage>en-US</UILanguage>
                </SetupUILanguage>

                <InputLocale>en-US</InputLocale>
                <SystemLocale>en-US</SystemLocale>
                <UILanguage>en-US</UILanguage>
                <UserLocale>en-US</UserLocale>

              </component>

              <component
                name="Microsoft-Windows-Setup"
                processorArchitecture="amd64"
                publicKeyToken="31bf3856ad364e35"
                language="neutral"
                versionScope="nonSxS">

                <DiskConfiguration>

                  <Disk wcm:action="add">

                    <DiskID>0</DiskID>

                    <WillWipeDisk>true</WillWipeDisk>

                    <CreatePartitions>

                      <CreatePartition wcm:action="add">
                        <Order>1</Order>
                        <Size>100</Size>
                        <Type>EFI</Type>
                      </CreatePartition>

                      <CreatePartition wcm:action="add">
                        <Order>2</Order>
                        <Size>16</Size>
                        <Type>MSR</Type>
                      </CreatePartition>

                      <CreatePartition wcm:action="add">
                        <Order>3</Order>
                        <Extend>true</Extend>
                        <Type>Primary</Type>
                      </CreatePartition>

                    </CreatePartitions>

                    <ModifyPartitions>

                      <ModifyPartition wcm:action="add">
                        <Order>1</Order>
                        <PartitionID>1</PartitionID>
                        <Format>FAT32</Format>
                        <Label>System</Label>
                      </ModifyPartition>

                      <ModifyPartition wcm:action="add">
                        <Order>2</Order>
                        <PartitionID>2</PartitionID>
                      </ModifyPartition>

                      <ModifyPartition wcm:action="add">
                        <Order>3</Order>
                        <PartitionID>3</PartitionID>
                        <Format>NTFS</Format>
                        <Label>Windows</Label>
                        <Letter>C</Letter>
                      </ModifyPartition>

                    </ModifyPartitions>

                  </Disk>

                  <WillShowUI>OnError</WillShowUI>

                </DiskConfiguration>

                <ImageInstall>

                  <OSImage>

                    <InstallTo>

                      <DiskID>0</DiskID>
                      <PartitionID>3</PartitionID>

                    </InstallTo>

                    <WillShowUI>OnError</WillShowUI>

                  </OSImage>

                </ImageInstall>

                <UserData>

                  <AcceptEula>true</AcceptEula>

                </UserData>

              </component>

            </settings>

            <settings pass="oobeSystem">

              <component
                name="Microsoft-Windows-International-Core"
                processorArchitecture="amd64"
                publicKeyToken="31bf3856ad364e35"
                language="neutral"
                versionScope="nonSxS">

                <InputLocale>en-US</InputLocale>
                <SystemLocale>en-US</SystemLocale>
                <UILanguage>en-US</UILanguage>
                <UserLocale>en-US</UserLocale>

              </component>

              <component
                name="Microsoft-Windows-Shell-Setup"
                processorArchitecture="amd64"
                publicKeyToken="31bf3856ad364e35"
                language="neutral"
                versionScope="nonSxS">

                <OOBE>

                  <HideEULAPage>true</HideEULAPage>
                  <HideOnlineAccountScreens>true</HideOnlineAccountScreens>
                  <HideOEMRegistrationScreen>true</HideOEMRegistrationScreen>
                  <HideWirelessSetupInOOBE>true</HideWirelessSetupInOOBE>

                  <ProtectYourPC>3</ProtectYourPC>

                </OOBE>

                <UserAccounts>

                  <LocalAccounts>

                    <LocalAccount wcm:action="add">

                      <Name>storeuser</Name>

                      <DisplayName>Windows User</DisplayName>

                      <Group>Administrators</Group>

                      <Password>

                        <Value>${RDP_PASSWORD}</Value>
                        <PlainText>true</PlainText>

                      </Password>

                    </LocalAccount>

                  </LocalAccounts>

                </UserAccounts>

                <AutoLogon>

                  <Enabled>true</Enabled>

                  <Username>storeuser</Username>

                  <LogonCount>20</LogonCount>

                  <Password>

                    <Value>${RDP_PASSWORD}</Value>
                    <PlainText>true</PlainText>

                  </Password>

                </AutoLogon>

              </component>

            </settings>

          </unattend>
          XML

          echo "Autounattend.xml created."


      # ============================================================
      # CREATE ANSWER ISO
      # ============================================================
      - name: Create answer ISO
        run: |
          set -euxo pipefail

          xorriso \
            -as mkisofs \
            -iso-level 3 \
            -V ANSWER \
            -o "$HOME/windows-store/work/answer.iso" \
            "$HOME/windows-store/answer"

          ls -lh "$HOME/windows-store/work/answer.iso"


      # ============================================================
      # CREATE 64GB WINDOWS DISK
      # ============================================================
      - name: Create virtual disk
        run: |
          set -euxo pipefail

          qemu-img create \
            -f qcow2 \
            "$HOME/windows-store/work/windows.qcow2" \
            64G

          qemu-img info \
            "$HOME/windows-store/work/windows.qcow2"


      # ============================================================
      # TPM 2.0
      # ============================================================
      - name: Start TPM
        run: |
          set -euxo pipefail

          WORK="$HOME/windows-store/work"

          mkdir -p "$WORK/tpm"

          swtpm socket \
            --tpm2 \
            --tpmstate dir="$WORK/tpm" \
            --ctrl type=unixio,path="$WORK/swtpm.sock" \
            --daemon

          sleep 2

          test -S "$WORK/swtpm.sock"

          echo "TPM 2.0 ready."


      # ============================================================
      # START WINDOWS
      #
      # CD/DVD IS FIRST BOOT DEVICE.
      # QEMU sends ENTER automatically so the user doesn't
      # have to press a key at:
      #
      # Press any key to boot from CD or DVD...
      # ============================================================
      - name: Start Windows VM
        run: |
          set -euxo pipefail

          WORK="$HOME/windows-store/work"

          OVMF_CODE="/usr/share/OVMF/OVMF_CODE_4M.fd"
          OVMF_VARS="/usr/share/OVMF/OVMF_VARS_4M.fd"

          if [ ! -f "$OVMF_CODE" ]; then
            OVMF_CODE="/usr/share/OVMF/OVMF_CODE.fd"
          fi

          if [ ! -f "$OVMF_VARS" ]; then
            OVMF_VARS="/usr/share/OVMF/OVMF_VARS.fd"
          fi

          test -f "$OVMF_CODE"
          test -f "$OVMF_VARS"

          cp "$OVMF_VARS" "$WORK/OVMF_VARS.fd"

          qemu-system-x86_64 \
            -accel tcg,thread=multi \
            -machine q35 \
            -cpu max \
            -m 8G \
            -smp 4 \
            -drive if=pflash,format=raw,readonly=on,file="$OVMF_CODE" \
            -drive if=pflash,format=raw,file="$WORK/OVMF_VARS.fd" \
            -chardev socket,id=chrtpm,path="$WORK/swtpm.sock" \
            -tpmdev emulator,id=tpm0,chardev=chrtpm \
            -device tpm-tis,tpmdev=tpm0 \
            -drive file="$WORK/windows.qcow2",format=qcow2,if=ide \
            -drive file="$HOME/windows-store/windows.iso",media=cdrom,readonly=on \
            -drive file="$WORK/answer.iso",media=cdrom,readonly=on \
            -boot order=d \
            -netdev user,id=net0 \
            -device e1000,netdev=net0 \
            -vnc 127.0.0.1:0 \
            -display none \
            -serial file:"$WORK/qemu-serial.log" \
            -monitor unix:"$WORK/qemu-monitor.sock",server=on,wait=off \
            -pidfile "$WORK/qemu.pid" \
            -daemonize

          sleep 5

          PID="$(cat "$WORK/qemu.pid")"

          if ! kill -0 "$PID" 2>/dev/null; then
            echo "ERROR: QEMU stopped."

            cat "$WORK/qemu-serial.log" || true

            exit 1
          fi

          echo "Windows VM started."


      # ============================================================
      # AUTOMATICALLY PRESS ENTER
      # ============================================================
      - name: Boot installer automatically
        run: |
          set -euxo pipefail

          WORK="$HOME/windows-store/work"

          echo "Waiting for Windows boot prompt..."

          sleep 10

          for i in $(seq 1 10); do

            if [ -S "$WORK/qemu-monitor.sock" ]; then

              echo "Sending ENTER..."

              printf 'sendkey ret\n' | \
                socat - UNIX-CONNECT:"$WORK/qemu-monitor.sock" \
                || true

              sleep 3

              echo "ENTER sent."

              break

            fi

            sleep 2

          done


      # ============================================================
      # WAIT FOR VNC
      # ============================================================
      - name: Wait for VNC
        run: |
          set -euxo pipefail

          READY=0

          for i in $(seq 1 120); do

            if nc -z 127.0.0.1 5900 2>/dev/null; then

              echo "VNC ready."

              READY=1

              break

            fi

            echo "Waiting for VNC... $i/120"

            sleep 2

          done

          if [ "$READY" -ne 1 ]; then

            echo "ERROR: VNC failed."

            cat "$HOME/windows-store/work/qemu-serial.log" || true

            exit 1

          fi


      # ============================================================
      # NOVNC
      # ============================================================
      - name: Install noVNC
        run: |
          set -euxo pipefail

          cd "$HOME/windows-store/work"

          git clone \
            --depth 1 \
            https://github.com/novnc/noVNC.git \
            novnc

          echo "noVNC installed."


      # ============================================================
      # START NOVNC
      # ============================================================
      - name: Start noVNC
        run: |
          set -euxo pipefail

          WORK="$HOME/windows-store/work"

          cd "$WORK/novnc"

          nohup ./utils/novnc_proxy \
            --vnc 127.0.0.1:5900 \
            --listen 127.0.0.1:6080 \
            > "$WORK/novnc.log" 2>&1 &

          PID=$!

          echo "$PID" > "$WORK/novnc.pid"

          sleep 5

          if ! kill -0 "$PID" 2>/dev/null; then

            echo "ERROR: noVNC failed."

            cat "$WORK/novnc.log" || true

            exit 1

          fi

          echo "noVNC running."


      # ============================================================
      # CLOUDFLARED
      # ============================================================
      - name: Install Cloudflare tunnel
        run: |
          set -euxo pipefail

          wget -q \
            https://github.com/cloudflare/cloudflared/releases/latest/download/cloudflared-linux-amd64.deb \
            -O "$HOME/cloudflared.deb"

          sudo dpkg -i "$HOME/cloudflared.deb"

          cloudflared --version


      # ============================================================
      # PUBLIC BROWSER URL
      # ============================================================
      - name: Create browser URL
        run: |
          set -euxo pipefail

          WORK="$HOME/windows-store/work"

          nohup cloudflared tunnel \
            --no-autoupdate \
            --url http://127.0.0.1:6080 \
            > "$WORK/cloudflared.log" 2>&1 &

          PID=$!

          echo "$PID" > "$WORK/cloudflared.pid"

          URL=""

          for i in $(seq 1 60); do

            URL="$(
              grep -Eo \
                'https://[-a-zA-Z0-9]+\.trycloudflare\.com' \
                "$WORK/cloudflared.log" \
                | head -n 1 \
                || true
            )"

            if [ -n "$URL" ]; then
              break
            fi

            echo "Waiting for Cloudflare URL... $i/60"

            sleep 2

          done

          if [ -z "$URL" ]; then

            echo "ERROR: Cloudflare URL not created."

            cat "$WORK/cloudflared.log" || true

            exit 1

          fi

          echo "$URL" > "$WORK/browser-url.txt"

          echo
          echo
          echo "=============================================================="
          echo "              WINDOWS BROWSER VM READY"
          echo "=============================================================="
          echo
          echo "OPEN THIS ON YOUR PHONE:"
          echo
          echo "$URL/vnc.html?autoconnect=true&resize=remote"
          echo
          echo "=============================================================="
          echo
          echo "REAL MICROSOFT WINDOWS"
          echo "MICROSOFT STORE: INCLUDED IN NORMAL WINDOWS INSTALL"
          echo "ACCESS: BROWSER / noVNC"
          echo
          echo "=============================================================="


      # ============================================================
      # KEEP VM ALIVE
      # ============================================================
      - name: Keep VM alive
        run: |
          set -euxo pipefail

          WORK="$HOME/windows-store/work"

          URL="$(cat "$WORK/browser-url.txt")"

          echo
          echo "=============================================================="
          echo "WINDOWS VM RUNNING"
          echo
          echo "BROWSER:"
          echo "$URL/vnc.html?autoconnect=true&resize=remote"
          echo "=============================================================="

          while true; do

            QEMU_PID="$(cat "$WORK/qemu.pid")"

            if ! kill -0 "$QEMU_PID" 2>/dev/null; then

              echo "Windows VM stopped."

              cat "$WORK/qemu-serial.log" || true

              exit 1

            fi

            NOVNC_PID="$(cat "$WORK/novnc.pid")"

            if ! kill -0 "$NOVNC_PID" 2>/dev/null; then

              echo "noVNC stopped."

              cat "$WORK/novnc.log" || true

              exit 1

            fi

            CLOUDFLARED_PID="$(cat "$WORK/cloudflared.pid")"

            if ! kill -0 "$CLOUDFLARED_PID" 2>/dev/null; then

              echo "Cloudflare tunnel stopped."

              cat "$WORK/cloudflared.log" || true

              exit 1

            fi

            echo "VM running."

            sleep 60

          done
