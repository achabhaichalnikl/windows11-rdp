name: Windows 11 RDP

on:
  workflow_dispatch:

jobs:
  windows-rdp:
    runs-on: ubuntu-24.04
    timeout-minutes: 90

    steps:

      - name: Install required packages
        run: |
          set -euxo pipefail

          sudo apt-get update

          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y \
            qemu-system-x86 \
            qemu-utils \
            ovmf \
            swtpm \
            swtpm-tools \
            xorriso \
            wimtools \
            p7zip-full \
            curl \
            wget \
            netcat-openbsd \
            libxml2-utils

      - name: Check runner
        run: |
          set -euxo pipefail

          echo "===== CPU ====="
          nproc

          echo "===== MEMORY ====="
          free -h

          echo "===== DISK ====="
          df -h

          echo "===== KVM ====="

          if [ -e /dev/kvm ] && [ -r /dev/kvm ] && [ -w /dev/kvm ]; then
            echo "KVM is available"
          else
            echo "KVM is NOT available"
          fi

      - name: Prepare workspace
        run: |
          set -euxo pipefail

          WORK="$RUNNER_TEMP/windows"

          rm -rf "$WORK"
          mkdir -p "$WORK/iso"

          echo "WORK=$WORK" >> "$GITHUB_ENV"

      - name: Download official Microsoft ISO
        env:
          WINDOWS_ISO_URL: ${{ secrets.WINDOWS_ISO_URL }}
        run: |
          set -euxo pipefail

          if [ -z "${WINDOWS_ISO_URL:-}" ]; then
            echo "ERROR: WINDOWS_ISO_URL secret is missing."
            exit 1
          fi

          echo "Downloading official Microsoft Windows ISO..."

          curl \
            -L \
            --fail \
            --retry 5 \
            --retry-delay 5 \
            -o "$WORK/windows.iso" \
            "$WINDOWS_ISO_URL"

          echo
          echo "ISO downloaded:"
          ls -lh "$WORK/windows.iso"

      - name: Extract ISO
        run: |
          set -euxo pipefail

          echo "Extracting Windows ISO..."

          7z x \
            "$WORK/windows.iso" \
            "-o$WORK/iso" \
            -y

          if [ -f "$WORK/iso/sources/install.wim" ]; then
            WIM="$WORK/iso/sources/install.wim"

          elif [ -f "$WORK/iso/sources/install.esd" ]; then
            WIM="$WORK/iso/sources/install.esd"

          else
            echo "ERROR: install.wim/install.esd not found."
            exit 1
          fi

          echo "WIM=$WIM" >> "$GITHUB_ENV"

          echo
          echo "Windows image:"
          echo "$WIM"

      - name: Verify Windows 11 Pro
        run: |
          set -euxo pipefail

          echo
          echo "===== WINDOWS EDITIONS ====="

          wimlib-imagex info "$WIM"

          echo
          echo "======================================"
          echo "Windows 11 Pro confirmed at Index 6"
          echo "======================================"

          INDEX=6

          echo "WINDOWS_IMAGE_INDEX=$INDEX" >> "$GITHUB_ENV"

      - name: Create Autounattend.xml
        env:
          RDP_PASSWORD: ${{ secrets.RDP_PASSWORD }}
        run: |
          set -euxo pipefail

          if [ -z "${RDP_PASSWORD:-}" ]; then
            echo "ERROR: RDP_PASSWORD secret is missing."
            exit 1
          fi

          mkdir -p "$WORK/unattend"

          python3 - <<'PY'
          import os
          import base64

          password = os.environ["RDP_PASSWORD"]

          encoded_password = base64.b64encode(
              password.encode("utf-16le")
          ).decode("ascii")

          xml = f'''<?xml version="1.0" encoding="utf-8"?>

          <unattend
              xmlns="urn:schemas-microsoft-com:unattend"
              xmlns:wcm="http://schemas.microsoft.com/WMIConfig/2002/State">

            <settings pass="windowsPE">

              <component
                  name="Microsoft-Windows-International-Core-WinPE"
                  processorArchitecture="amd64"
                  publicKeyToken="31bf3856ad364e35"
                  language="neutral"
                  versionScope="nonSxS">

                <SetupUILanguage>
                  <UILanguage>en-US</UILanguage>
                </SetupUILanguage>

                <InputLocale>en-US</InputLocale>
                <SystemLocale>en-US</SystemLocale>
                <UILanguage>en-US</UILanguage>
                <UserLocale>en-US</UserLocale>

              </component>


              <component
                  name="Microsoft-Windows-Setup"
                  processorArchitecture="amd64"
                  publicKeyToken="31bf3856ad364e35"
                  language="neutral"
                  versionScope="nonSxS">

                <ImageInstall>

                  <OSImage>

                    <InstallFrom>

                      <MetaData wcm:action="add">
                        <Key>/IMAGE/INDEX</Key>
                        <Value>6</Value>
                      </MetaData>

                    </InstallFrom>

                    <InstallTo>
                      <DiskID>0</DiskID>
                      <PartitionID>3</PartitionID>
                    </InstallTo>

                    <WillShowUI>OnError</WillShowUI>

                  </OSImage>

                </ImageInstall>


                <DiskConfiguration>

                  <Disk wcm:action="add">

                    <DiskID>0</DiskID>

                    <WillWipeDisk>true</WillWipeDisk>

                    <CreatePartitions>

                      <CreatePartition wcm:action="add">
                        <Order>1</Order>
                        <Type>EFI</Type>
                        <Size>100</Size>
                      </CreatePartition>

                      <CreatePartition wcm:action="add">
                        <Order>2</Order>
                        <Type>MSR</Type>
                        <Size>16</Size>
                      </CreatePartition>

                      <CreatePartition wcm:action="add">
                        <Order>3</Order>
                        <Type>Primary</Type>
                        <Extend>true</Extend>
                      </CreatePartition>

                    </CreatePartitions>


                    <ModifyPartitions>

                      <ModifyPartition wcm:action="add">
                        <Order>1</Order>
                        <PartitionID>1</PartitionID>
                        <Format>FAT32</Format>
                        <Label>System</Label>
                      </ModifyPartition>

                      <ModifyPartition wcm:action="add">
                        <Order>2</Order>
                        <PartitionID>2</PartitionID>
                      </ModifyPartition>

                      <ModifyPartition wcm:action="add">
                        <Order>3</Order>
                        <PartitionID>3</PartitionID>
                        <Format>NTFS</Format>
                        <Label>Windows</Label>
                        <Letter>C</Letter>
                      </ModifyPartition>

                    </ModifyPartitions>

                  </Disk>

                </DiskConfiguration>


                <UserData>

                  <AcceptEula>true</AcceptEula>

                  <ProductKey>

                    <Key>
                      VK7JG-NPHTM-C97JM-9MPGT-3V66T
                    </Key>

                    <WillShowUI>Never</WillShowUI>

                  </ProductKey>

                </UserData>

              </component>

            </settings>


            <settings pass="specialize">

              <component
                  name="Microsoft-Windows-TerminalServices-LocalSessionManager"
                  processorArchitecture="amd64"
                  publicKeyToken="31bf3856ad364e35"
                  language="neutral"
                  versionScope="nonSxS">

                <fDenyTSConnections>false</fDenyTSConnections>

              </component>


              <component
                  name="Microsoft-Windows-TerminalServices-RDP-WinStationExtensions"
                  processorArchitecture="amd64"
                  publicKeyToken="31bf3856ad364e35"
                  language="neutral"
                  versionScope="nonSxS">

                <UserAuthentication>1</UserAuthentication>

              </component>


              <component
                  name="Microsoft-Windows-Shell-Setup"
                  processorArchitecture="amd64"
                  publicKeyToken="31bf3856ad364e35"
                  language="neutral"
                  versionScope="nonSxS">

                <ComputerName>WIN11-RDP</ComputerName>

              </component>


              <component
                  name="Microsoft-Windows-Deployment"
                  processorArchitecture="amd64"
                  publicKeyToken="31bf3856ad364e35"
                  language="neutral"
                  versionScope="nonSxS">

                <RunSynchronous>


                  <RunSynchronousCommand wcm:action="add">

                    <Order>1</Order>

                    <Description>Enable Remote Desktop</Description>

                    <Path>
                      cmd /c reg add "HKLM\SYSTEM\CurrentControlSet\Control\Terminal Server" /v fDenyTSConnections /t REG_DWORD /d 0 /f
                    </Path>

                  </RunSynchronousCommand>


                  <RunSynchronousCommand wcm:action="add">

                    <Order>2</Order>

                    <Description>Enable RDP Firewall</Description>

                    <Path>
                      cmd /c netsh advfirewall firewall set rule group="remote desktop" new enable=yes
                    </Path>

                  </RunSynchronousCommand>


                  <RunSynchronousCommand wcm:action="add">

                    <Order>3</Order>

                    <Description>Configure Remote Desktop Service</Description>

                    <Path>
                      cmd /c sc config TermService start= auto
                    </Path>

                  </RunSynchronousCommand>


                  <RunSynchronousCommand wcm:action="add">

                    <Order>4</Order>

                    <Description>Start Remote Desktop Service</Description>

                    <Path>
                      cmd /c net start TermService
                    </Path>

                  </RunSynchronousCommand>


                  <RunSynchronousCommand wcm:action="add">

                    <Order>5</Order>

                    <Description>Add RDP user</Description>

                    <Path>
                      cmd /c net localgroup "Remote Desktop Users" rdpuser /add
                    </Path>

                  </RunSynchronousCommand>


                </RunSynchronous>

              </component>

            </settings>


            <settings pass="oobeSystem">

              <component
                  name="Microsoft-Windows-International-Core"
                  processorArchitecture="amd64"
                  publicKeyToken="31bf3856ad364e35"
                  language="neutral"
                  versionScope="nonSxS">

                <InputLocale>en-US</InputLocale>
                <SystemLocale>en-US</SystemLocale>
                <UILanguage>en-US</UILanguage>
                <UserLocale>en-US</UserLocale>

              </component>


              <component
                  name="Microsoft-Windows-Shell-Setup"
                  processorArchitecture="amd64"
                  publicKeyToken="31bf3856ad364e35"
                  language="neutral"
                  versionScope="nonSxS">

                <OOBE>

                  <HideEULAPage>true</HideEULAPage>

                  <HideLocalAccountScreen>true</HideLocalAccountScreen>

                  <HideOnlineAccountScreens>true</HideOnlineAccountScreens>

                  <HideWirelessSetupInOOBE>true</HideWirelessSetupInOOBE>

                  <ProtectYourPC>3</ProtectYourPC>

                </OOBE>


                <UserAccounts>

                  <LocalAccounts>

                    <LocalAccount wcm:action="add">

                      <Name>rdpuser</Name>

                      <DisplayName>RDP User</DisplayName>

                      <Group>Administrators</Group>

                      <Password>

                        <Value>{encoded_password}</Value>

                        <PlainText>false</PlainText>

                      </Password>

                    </LocalAccount>

                  </LocalAccounts>

                </UserAccounts>


                <AutoLogon>

                  <Enabled>true</Enabled>

                  <Username>rdpuser</Username>

                  <Password>

                    <Value>{encoded_password}</Value>

                    <PlainText>false</PlainText>

                  </Password>

                  <LogonCount>1</LogonCount>

                </AutoLogon>


                <RegisteredOwner>RDP User</RegisteredOwner>

                <RegisteredOrganization>Temporary VM</RegisteredOrganization>

              </component>

            </settings>

          </unattend>
          '''

          path = os.path.join(
              os.environ["WORK"],
              "unattend",
              "Autounattend.xml"
          )

          with open(path, "w", encoding="utf-8") as f:
              f.write(xml)

          print("Autounattend.xml created.")
          PY

          xmllint \
            --noout \
            "$WORK/unattend/Autounattend.xml"

          echo "Autounattend.xml XML validation successful."

      - name: Create unattended ISO
        run: |
          set -euxo pipefail

          xorriso \
            -as mkisofs \
            -iso-level 3 \
            -J \
            -R \
            -V AUTOUNATTEND \
            -o "$WORK/autounattend.iso" \
            "$WORK/unattend"

          echo
          echo "Unattended ISO created:"
          ls -lh "$WORK/autounattend.iso"

      - name: Create virtual disk
        run: |
          set -euxo pipefail

          qemu-img create \
            -f qcow2 \
            "$WORK/windows.qcow2" \
            64G

          qemu-img info "$WORK/windows.qcow2"

      - name: Prepare UEFI
        run: |
          set -euxo pipefail

          mkdir -p "$WORK/uefi"

          if [ -f /usr/share/OVMF/OVMF_CODE_4M.ms.fd ]; then
            CODE=/usr/share/OVMF/OVMF_CODE_4M.ms.fd

          elif [ -f /usr/share/OVMF/OVMF_CODE_4M.fd ]; then
            CODE=/usr/share/OVMF/OVMF_CODE_4M.fd

          else
            echo "ERROR: OVMF code firmware not found."
            exit 1
          fi


          if [ -f /usr/share/OVMF/OVMF_VARS_4M.ms.fd ]; then
            VARS_TEMPLATE=/usr/share/OVMF/OVMF_VARS_4M.ms.fd

          elif [ -f /usr/share/OVMF/OVMF_VARS_4M.fd ]; then
            VARS_TEMPLATE=/usr/share/OVMF/OVMF_VARS_4M.fd

          else
            echo "ERROR: OVMF variables firmware not found."
            exit 1
          fi


          cp \
            "$VARS_TEMPLATE" \
            "$WORK/uefi/OVMF_VARS.fd"


          echo "OVMF_CODE=$CODE" >> "$GITHUB_ENV"

          echo "OVMF_VARS=$WORK/uefi/OVMF_VARS.fd" >> "$GITHUB_ENV"

          echo
          echo "UEFI firmware:"
          echo "$CODE"

      - name: Start virtual TPM
        run: |
          set -euxo pipefail

          mkdir -p "$WORK/tpm"

          swtpm socket \
            --tpm2 \
            --tpmstate dir="$WORK/tpm" \
            --ctrl type=unixio,path="$WORK/tpm/swtpm.sock" \
            --daemon

          sleep 2

          if [ ! -S "$WORK/tpm/swtpm.sock" ]; then
            echo "ERROR: TPM socket was not created."
            exit 1
          fi

          echo "Virtual TPM started."

      - name: Detect KVM
        run: |
          set -euxo pipefail

          if [ -e /dev/kvm ] && \
             [ -r /dev/kvm ] && \
             [ -w /dev/kvm ]; then

            echo "KVM=on" >> "$GITHUB_ENV"

            echo "KVM is available."

          else

            echo "KVM=off" >> "$GITHUB_ENV"

            echo "KVM is NOT available."
            echo "Using software emulation."

          fi

      - name: Start Windows VM
        run: |
          set -euxo pipefail

          echo "Starting Windows 11 Pro VM..."

          if [ "$KVM" = "on" ]; then
            ACCEL="-enable-kvm"
          else
            ACCEL="-accel tcg,thread=multi"
          fi


          qemu-system-x86_64 \
            $ACCEL \
            -cpu max \
            -machine q35 \
            -m 8G \
            -smp 4 \
            -drive if=pflash,format=raw,readonly=on,file="$OVMF_CODE" \
            -drive if=pflash,format=raw,file="$OVMF_VARS" \
            -chardev socket,id=chrtpm,path="$WORK/tpm/swtpm.sock" \
            -tpmdev emulator,id=tpm0,chardev=chrtpm \
            -device tpm-tis,tpmdev=tpm0 \
            -drive file="$WORK/windows.qcow2",format=qcow2,if=virtio \
            -drive file="$WORK/windows.iso",media=cdrom,readonly=on \
            -drive file="$WORK/autounattend.iso",media=cdrom,readonly=on \
            -netdev user,id=net0,hostfwd=tcp:127.0.0.1:3389-:3389 \
            -device virtio-net-pci,netdev=net0 \
            -boot order=d \
            -display none \
            -serial file:"$WORK/qemu-serial.log" \
            -monitor unix:"$WORK/qemu-monitor.sock",server=on,wait=off \
            -daemonize


          sleep 10


          if ! pgrep -x qemu-system-x86_64 >/dev/null; then

            echo "ERROR: QEMU stopped."

            echo
            echo "===== QEMU LOG ====="

            cat "$WORK/qemu-serial.log" || true

            exit 1

          fi


          echo "QEMU is running."

      - name: Wait for Windows RDP
        run: |
          set -u

          echo
          echo "Waiting for Windows installation..."
          echo "This can take a long time when KVM is unavailable."
          echo

          MAX_SECONDS=$((60 * 60))
          ELAPSED=0

          while [ "$ELAPSED" -lt "$MAX_SECONDS" ]; do

            if ! pgrep -x qemu-system-x86_64 >/dev/null; then

              echo
              echo "ERROR: QEMU stopped."

              echo
              echo "===== QEMU LOG ====="

              cat "$WORK/qemu-serial.log" || true

              exit 1

            fi


            if nc -z 127.0.0.1 3389 2>/dev/null; then

              echo
              echo "======================================"
              echo "RDP IS AVAILABLE"
              echo "======================================"
              echo
              echo "Username: rdpuser"
              echo "Password: RDP_PASSWORD secret"
              echo "Port: 3389"
              echo

              break

            fi


            if [ $((ELAPSED % 60)) -eq 0 ]; then

              echo "Still installing..."
              echo "Elapsed: ${ELAPSED}s"

              df -h /

            fi


            sleep 20

            ELAPSED=$((ELAPSED + 20))

          done


          if ! nc -z 127.0.0.1 3389 2>/dev/null; then

            echo
            echo "======================================"
            echo "RDP DID NOT START"
            echo "======================================"

            echo
            echo "===== QEMU LOG ====="

            cat "$WORK/qemu-serial.log" || true

            echo
            echo "===== DISK ====="

            df -h

            exit 1

          fi

      - name: Keep VM alive
        if: success()
        run: |
          set -u

          echo
          echo "======================================"
          echo "WINDOWS VM IS RUNNING"
          echo "======================================"
          echo
          echo "The GitHub job must stay running."
          echo

          for i in $(seq 1 150); do

            if ! pgrep -x qemu-system-x86_64 >/dev/null; then

              echo "QEMU stopped."

              exit 1

            fi


            if nc -z 127.0.0.1 3389 2>/dev/null; then

              echo "[$i/150] RDP reachable."

            else

              echo "[$i/150] RDP unavailable."

            fi


            sleep 20

          done

      - name: Cleanup
        if: always()
        run: |
          set +e

          echo "Cleaning up..."

          pkill -x qemu-system-x86_64 || true

          pkill -x swtpm || true

          rm -rf "$WORK"

          echo "Cleanup complete."
