name: Windows 11 RDP - TCG + Tailscale

on:
  workflow_dispatch:

jobs:
  windows-rdp:
    runs-on: ubuntu-24.04
    timeout-minutes: 90

    steps:

      - name: Install packages
        run: |
          set -euxo pipefail

          sudo apt-get update

          sudo apt-get install -y \
            qemu-system-x86 \
            qemu-utils \
            ovmf \
            swtpm \
            swtpm-tools \
            xorriso \
            wimtools \
            p7zip-full \
            curl \
            wget \
            netcat-openbsd \
            libxml2-utils

      - name: Check runner
        run: |
          set -euxo pipefail

          echo "CPU:"
          nproc

          echo
          echo "MEMORY:"
          free -h

          echo
          echo "DISK:"
          df -h /

          echo
          echo "KVM:"
          if [ -e /dev/kvm ]; then
            ls -l /dev/kvm || true
          else
            echo "KVM unavailable - using TCG software emulation."
          fi

      - name: Prepare workspace
        run: |
          set -euxo pipefail

          rm -rf "$HOME/windows-rdp"

          mkdir -p \
            "$HOME/windows-rdp/iso" \
            "$HOME/windows-rdp/work" \
            "$HOME/windows-rdp/ovmf"

      - name: Download official Microsoft Windows ISO
        env:
          WINDOWS_ISO_URL: ${{ secrets.WINDOWS_ISO_URL }}
        run: |
          set -euxo pipefail

          if [ -z "${WINDOWS_ISO_URL:-}" ]; then
            echo "ERROR: WINDOWS_ISO_URL secret is missing."
            exit 1
          fi

          curl -L \
            --fail \
            --retry 5 \
            --retry-delay 5 \
            -o "$HOME/windows-rdp/windows.iso" \
            "$WINDOWS_ISO_URL"

          echo "Windows ISO downloaded:"
          ls -lh "$HOME/windows-rdp/windows.iso"

      - name: Extract Windows ISO
        run: |
          set -euxo pipefail

          7z x \
            "$HOME/windows-rdp/windows.iso" \
            -o"$HOME/windows-rdp/iso" \
            -y

          test -f "$HOME/windows-rdp/iso/sources/install.wim"

          echo "install.wim found."

      - name: Verify Windows 11 Pro
        run: |
          set -euxo pipefail

          WORK="$HOME/windows-rdp/work"
          WIM="$HOME/windows-rdp/iso/sources/install.wim"

          wimlib-imagex info "$WIM" > "$WORK/wim-info.txt"

          cat "$WORK/wim-info.txt"

          if ! grep -q '^Index:[[:space:]]*6$' "$WORK/wim-info.txt"; then
            echo "ERROR: Windows 11 Pro index 6 was not found."
            exit 1
          fi

          PRO_NAME="$(
            awk '
              /^Index:/ { idx=$2 }
              /^Name:/ {
                name=$0
                sub(/^Name:[[:space:]]*/, "", name)
                if (idx == 6) {
                  print name
                  exit
                }
              }
            ' "$WORK/wim-info.txt"
          )"

          echo "Selected edition: $PRO_NAME"

          if [ "$PRO_NAME" != "Windows 11 Pro" ]; then
            echo "ERROR: Index 6 is not Windows 11 Pro."
            exit 1
          fi

      - name: Create Autounattend.xml
        env:
          RDP_PASSWORD: ${{ secrets.RDP_PASSWORD }}
        run: |
          set -euxo pipefail

          WORK="$HOME/windows-rdp/work"

          if [ -z "${RDP_PASSWORD:-}" ]; then
            echo "ERROR: RDP_PASSWORD secret is missing."
            exit 1
          fi

          PASSWORD_B64="$(
            printf '%s' "$RDP_PASSWORD" |
            iconv -f UTF-8 -t UTF-16LE |
            base64 -w 0
          )"

          cat > "$WORK/Autounattend.xml" <<EOF
          <?xml version="1.0" encoding="utf-8"?>
          <unattend xmlns="urn:schemas-microsoft-com:unattend">

            <settings pass="windowsPE">

              <component
                name="Microsoft-Windows-International-Core-WinPE"
                processorArchitecture="amd64"
                publicKeyToken="31bf3856ad364e35"
                language="neutral"
                versionScope="nonSxS">

                <SetupUILanguage>
                  <UILanguage>en-US</UILanguage>
                </SetupUILanguage>

                <InputLocale>en-US</InputLocale>
                <SystemLocale>en-US</SystemLocale>
                <UILanguage>en-US</UILanguage>
                <UserLocale>en-US</UserLocale>

              </component>

              <component
                name="Microsoft-Windows-Setup"
                processorArchitecture="amd64"
                publicKeyToken="31bf3856ad364e35"
                language="neutral"
                versionScope="nonSxS">

                <ImageInstall>
                  <OSImage>

                    <InstallFrom>

                      <MetaData
                        wcm:action="add"
                        xmlns:wcm="http://schemas.microsoft.com/WMIConfig/2002/State">

                        <Key>/IMAGE/INDEX</Key>
                        <Value>6</Value>

                      </MetaData>

                    </InstallFrom>

                    <InstallTo>
                      <DiskID>0</DiskID>
                      <PartitionID>3</PartitionID>
                    </InstallTo>

                  </OSImage>
                </ImageInstall>

                <DiskConfiguration>

                  <Disk
                    wcm:action="add"
                    xmlns:wcm="http://schemas.microsoft.com/WMIConfig/2002/State">

                    <DiskID>0</DiskID>
                    <WillWipeDisk>true</WillWipeDisk>

                    <CreatePartitions>

                      <CreatePartition wcm:action="add">
                        <Order>1</Order>
                        <Size>100</Size>
                        <Type>EFI</Type>
                      </CreatePartition>

                      <CreatePartition wcm:action="add">
                        <Order>2</Order>
                        <Size>16</Size>
                        <Type>MSR</Type>
                      </CreatePartition>

                      <CreatePartition wcm:action="add">
                        <Order>3</Order>
                        <Extend>true</Extend>
                        <Type>Primary</Type>
                      </CreatePartition>

                    </CreatePartitions>

                    <ModifyPartitions>

                      <ModifyPartition wcm:action="add">
                        <Order>1</Order>
                        <PartitionID>1</PartitionID>
                        <Format>FAT32</Format>
                        <Label>System</Label>
                      </ModifyPartition>

                      <ModifyPartition wcm:action="add">
                        <Order>2</Order>
                        <PartitionID>2</PartitionID>
                      </ModifyPartition>

                      <ModifyPartition wcm:action="add">
                        <Order>3</Order>
                        <PartitionID>3</PartitionID>
                        <Format>NTFS</Format>
                        <Label>Windows</Label>
                      </ModifyPartition>

                    </ModifyPartitions>

                  </Disk>

                </DiskConfiguration>

                <UserData>

                  <AcceptEula>true</AcceptEula>

                  <ProductKey>
                    <Key>VK7JG-NPHTM-C97JM-9MPGT-3V66T</Key>
                    <WillShowUI>Never</WillShowUI>
                  </ProductKey>

                </UserData>

              </component>

            </settings>

            <settings pass="specialize">

              <component
                name="Microsoft-Windows-TerminalServices-LocalSessionManager"
                processorArchitecture="amd64"
                publicKeyToken="31bf3856ad364e35"
                language="neutral"
                versionScope="nonSxS">

                <fDenyTSConnections>false</fDenyTSConnections>

              </component>

              <component
                name="Microsoft-Windows-TerminalServices-RDP-WinStationExtensions"
                processorArchitecture="amd64"
                publicKeyToken="31bf3856ad364e35"
                language="neutral"
                versionScope="nonSxS">

                <UserAuthentication>1</UserAuthentication>

              </component>

            </settings>

            <settings pass="oobeSystem">

              <component
                name="Microsoft-Windows-Shell-Setup"
                processorArchitecture="amd64"
                publicKeyToken="31bf3856ad364e35"
                language="neutral"
                versionScope="nonSxS">

                <OOBE>

                  <HideEULAPage>true</HideEULAPage>
                  <HideLocalAccountScreen>true</HideLocalAccountScreen>
                  <HideOEMRegistrationScreen>true</HideOEMRegistrationScreen>
                  <HideOnlineAccountScreens>true</HideOnlineAccountScreens>
                  <HideWirelessSetupInOOBE>true</HideWirelessSetupInOOBE>
                  <ProtectYourPC>3</ProtectYourPC>

                </OOBE>

                <UserAccounts>

                  <LocalAccounts>

                    <LocalAccount
                      wcm:action="add"
                      xmlns:wcm="http://schemas.microsoft.com/WMI/2002/State">

                      <Name>rdpuser</Name>
                      <DisplayName>RDP User</DisplayName>
