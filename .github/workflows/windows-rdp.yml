name: Temporary Windows 11 RDP

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  windows-vm:
    runs-on: ubuntu-24.04
    timeout-minutes: 350

    steps:

      # ==========================================================
      # 1. CHECK THE GITHUB MACHINE
      # ==========================================================
      - name: Check host
        shell: bash
        run: |
          set -euxo pipefail

          echo "===== SYSTEM ====="
          uname -a

          echo
          echo "===== ARCHITECTURE ====="
          uname -m
          dpkg --print-architecture

          echo
          echo "===== CPU ====="
          lscpu

          echo
          echo "===== MEMORY ====="
          free -h

          echo
          echo "===== KVM ====="

          if [ -e /dev/kvm ]; then
            ls -l /dev/kvm || true

            if [ -r /dev/kvm ] && [ -w /dev/kvm ]; then
              echo "KVM_DEVICE=available"
            else
              echo "KVM_DEVICE=permission-denied"
            fi
          else
            echo "KVM_DEVICE=missing"
          fi


      # ==========================================================
      # 2. INSTALL QEMU + TPM + UEFI TOOLS
      # ==========================================================
      - name: Install virtualization software
        shell: bash
        run: |
          set -euxo pipefail

          sudo apt-get update

          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y \
            qemu-system-x86 \
            qemu-utils \
            ovmf \
            swtpm \
            swtpm-tools \
            xorriso \
            wimtools \
            p7zip-full \
            curl \
            wget \
            ca-certificates \
            netcat-openbsd \
            socat \
            iproute2 \
            lsof \
            procps


      # ==========================================================
      # 3. VERIFY EVERYTHING
      # ==========================================================
      - name: Verify virtualization software
        shell: bash
        run: |
          set -euxo pipefail

          echo "===== QEMU ====="
          qemu-system-x86_64 --version

          echo
          echo "===== QEMU IMAGE ====="
          qemu-img --version

          echo
          echo "===== SWTPM ====="
          swtpm --version || true

          echo
          echo "===== OVMF ====="
          ls -lh /usr/share/OVMF/

          echo
          echo "===== QEMU LIBRARIES ====="
          ldd "$(command -v qemu-system-x86_64)" | tee /tmp/qemu-ldd.txt

          if grep -q "not found" /tmp/qemu-ldd.txt; then
            echo "::error::QEMU has missing shared libraries."
            exit 1
          fi


      # ==========================================================
      # 4. DOWNLOAD REAL MICROSOFT WINDOWS ISO
      # ==========================================================
      - name: Download Windows ISO
        shell: bash
        env:
          WINDOWS_ISO_URL: ${{ secrets.WINDOWS_ISO_URL }}
        run: |
          set -euo pipefail

          if [ -z "${WINDOWS_ISO_URL:-}" ]; then
            echo "::error::WINDOWS_ISO_URL secret is missing."
            exit 1
          fi

          case "$WINDOWS_ISO_URL" in
            https://software.download.prss.microsoft.com/*)
              echo "Microsoft ISO URL detected."
              ;;
            *)
              echo "::error::WINDOWS_ISO_URL does not appear to be the Microsoft ISO URL."
              exit 1
              ;;
          esac

          mkdir -p "$RUNNER_TEMP/windows"

          echo "Downloading Windows ISO..."
          echo "This can take several minutes because the ISO is about 5 GB."

          curl \
            --fail \
            --location \
            --retry 5 \
            --retry-delay 5 \
            --connect-timeout 30 \
            --output "$RUNNER_TEMP/windows/windows.iso" \
            "$WINDOWS_ISO_URL"

          if [ ! -s "$RUNNER_TEMP/windows/windows.iso" ]; then
            echo "::error::Windows ISO download failed or produced an empty file."
            exit 1
          fi

          echo
          echo "===== ISO SIZE ====="
          du -h "$RUNNER_TEMP/windows/windows.iso"

          echo
          echo "===== ISO SHA256 ====="
          sha256sum "$RUNNER_TEMP/windows/windows.iso"


      # ==========================================================
      # 5. CREATE VM DISK + UEFI
      # ==========================================================
      - name: Prepare VM
        shell: bash
        run: |
          set -euxo pipefail

          VM="$RUNNER_TEMP/windows-vm"

          mkdir -p "$VM"
          mkdir -p "$VM/tpm"

          echo "Creating 50 GB virtual disk..."

          qemu-img create \
            -f qcow2 \
            "$VM/windows.qcow2" \
            50G

          echo "Creating UEFI variables..."

          cp \
            /usr/share/OVMF/OVMF_VARS_4M.fd \
            "$VM/OVMF_VARS.fd"

          chmod 600 "$VM/OVMF_VARS.fd"

          echo "VM disk and UEFI prepared."


      # ==========================================================
      # 6. START SOFTWARE TPM
      # ==========================================================
      - name: Start virtual TPM
        shell: bash
        run: |
          set -euxo pipefail

          VM="$RUNNER_TEMP/windows-vm"

          SOCKET="$VM/tpm/swtpm.sock"

          rm -f "$SOCKET"

          echo "Starting TPM 2.0..."

          swtpm socket \
            --tpm2 \
            --tpmstate dir="$VM/tpm" \
            --ctrl type=unixio,path="$SOCKET" \
            --log level=20 \
            --daemon

          sleep 3

          if [ ! -S "$SOCKET" ]; then
            echo "::error::TPM socket was not created."

            ls -la "$VM/tpm"

            exit 1
          fi

          echo "TPM 2.0 is running."


      # ==========================================================
      # 7. SELECT KVM OR SOFTWARE EMULATION
      # ==========================================================
      - name: Select acceleration
        shell: bash
        run: |
          set -euo pipefail

          if [ -e /dev/kvm ] && \
             [ -r /dev/kvm ] && \
             [ -w /dev/kvm ]; then

            echo "KVM device exists and is readable/writable."

            if timeout 5 bash -c 'exec 3<>/dev/kvm'; then
              echo "KVM is usable."
              echo "QEMU_ACCEL=-enable-kvm" >> "$GITHUB_ENV"
              echo "QEMU_CPU=host" >> "$GITHUB_ENV"
            else
              echo "KVM exists but cannot be opened."
              echo "Using software emulation."

              echo "QEMU_ACCEL=-accel tcg,thread=multi" >> "$GITHUB_ENV"
              echo "QEMU_CPU=max" >> "$GITHUB_ENV"
            fi

          else

            echo "KVM is unavailable."
            echo "Using software emulation."

            echo "QEMU_ACCEL=-accel tcg,thread=multi" >> "$GITHUB_ENV"
            echo "QEMU_CPU=max" >> "$GITHUB_ENV"

          fi


      # ==========================================================
      # 8. START REAL WINDOWS VM
      # ==========================================================
      - name: Start Windows VM
        shell: bash
        run: |
          set -euo pipefail

          VM="$RUNNER_TEMP/windows-vm"

          TPM_SOCKET="$VM/tpm/swtpm.sock"

          echo "Starting QEMU..."

          qemu-system-x86_64 \
            $QEMU_ACCEL \
            -machine q35 \
            -cpu "$QEMU_CPU" \
            -smp 2 \
            -m 6G \
            \
            -drive if=pflash,format=raw,readonly=on,file=/usr/share/OVMF/OVMF_CODE_4M.fd \
            -drive if=pflash,format=raw,file="$VM/OVMF_VARS.fd" \
            \
            -drive file="$VM/windows.qcow2",format=qcow2,if=ide \
            \
            -cdrom "$RUNNER_TEMP/windows/windows.iso" \
            \
            -chardev socket,id=chrtpm,path="$TPM_SOCKET" \
            -tpmdev emulator,id=tpm0,chardev=chrtpm
