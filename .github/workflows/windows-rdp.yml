name: Windows 11 RDP - KVM Required

on:
  workflow_dispatch:

jobs:
  windows-rdp:
    runs-on: ubuntu-24.04
    timeout-minutes: 90

    steps:
      - name: Install required packages
        run: |
          set -euxo pipefail

          sudo apt-get update

          sudo apt-get install -y \
            qemu-system-x86 \
            qemu-utils \
            ovmf \
            swtpm \
            swtpm-tools \
            xorriso \
            wimtools \
            p7zip-full \
            curl \
            wget \
            netcat-openbsd \
            libxml2-utils

      - name: Check and enable KVM
        shell: bash
        run: |
          set -euxo pipefail

          echo "======================================"
          echo "Checking KVM"
          echo "======================================"

          if [ ! -e /dev/kvm ]; then
            echo
            echo "ERROR: /dev/kvm does not exist."
            echo "This runner does not expose KVM."
            exit 1
          fi

          echo
          echo "KVM device exists:"
          ls -l /dev/kvm

          echo
          echo "Checking KVM group..."

          if getent group kvm >/dev/null 2>&1; then
            echo "kvm group exists."
          else
            echo "Creating kvm group..."
            sudo groupadd kvm || true
          fi

          echo
          echo "Adding current user to kvm group..."

          sudo usermod -aG kvm "$USER" || true

          echo
          echo "Trying direct permission change..."

          sudo chmod 666 /dev/kvm || true

          echo
          echo "KVM permissions after adjustment:"
          ls -l /dev/kvm

          echo
          echo "Testing /dev/kvm access..."

          if [ ! -r /dev/kvm ] || [ ! -w /dev/kvm ]; then
            echo
            echo "ERROR: /dev/kvm is still not readable/writable."
            echo "The GitHub-hosted runner is preventing KVM access."
            exit 1
          fi

          echo
          echo "Testing REAL KVM acceleration with QEMU..."

          set +e

          timeout 8s sudo qemu-system-x86_64 \
            -accel kvm \
            -machine q35,accel=kvm \
            -S \
            -display none \
            -nodefaults \
            -monitor none \
            -serial none

          RESULT=$?

          set -e

          if [ "$RESULT" != "124" ] && [ "$RESULT" != "0" ]; then
            echo
            echo "ERROR: QEMU could not start with KVM."
            echo "KVM is NOT usable on this runner."
            echo "QEMU exit code: $RESULT"
            exit 1
          fi

          echo
          echo "======================================"
          echo "KVM IS AVAILABLE AND USABLE"
          echo "======================================"

      - name: Check runner resources
        run: |
          set -euxo pipefail

          echo "CPU:"
          nproc

          echo
          echo "MEMORY:"
          free -h

          echo
          echo "DISK:"
          df -h /

          echo
          echo "KVM:"
          ls -l /dev/kvm

      - name: Prepare workspace
        run: |
          set -euxo pipefail

          rm -rf "$HOME/windows-rdp"

          mkdir -p \
            "$HOME/windows-rdp/iso" \
            "$HOME/windows-rdp/work" \
            "$HOME/windows-rdp/ovmf"

      - name: Download official Microsoft Windows ISO
        env:
          WINDOWS_ISO_URL: ${{ secrets.WINDOWS_ISO_URL }}
        run: |
          set -euxo pipefail

          if [ -z "${WINDOWS_ISO_URL:-}" ]; then
            echo "ERROR: WINDOWS_ISO_URL secret is missing."
            exit 1
          fi

          curl \
            -L \
            --fail \
            --retry 5 \
            --retry-delay 5 \
            --output "$HOME/windows-rdp/windows.iso" \
            "$WINDOWS_ISO_URL"

          ls -lh "$HOME/windows-rdp/windows.iso"

      - name: Extract Windows ISO
        run: |
          set -euxo pipefail

          7z x \
            "$HOME/windows-rdp/windows.iso" \
            -o"$HOME/windows-rdp/iso" \
            -y

          test -f "$HOME/windows-rdp/iso/sources/install.wim"

          ls -lh "$HOME/windows-rdp/iso/sources/install.wim"

      - name: Find Windows 11 Pro image
        run: |
          set -euxo pipefail

          WORK="$HOME/windows-rdp/work"
          WIM="$HOME/windows-rdp/iso/sources/install.wim"

          echo "Reading WIM information..."

          wimlib-imagex info "$WIM" > "$WORK/wim-info.txt"

          echo
          echo "Windows images:"
          cat "$WORK/wim-info.txt"

          echo
          echo "Checking confirmed Windows 11 Pro index..."

          if ! grep -q '^Index:[[:space:]]*6$' "$WORK/wim-info.txt"; then
            echo
            echo "ERROR: Index 6 does not exist."
            exit 1
          fi

          PRO_NAME="$(
            awk '
              /^Index:/ {
                idx=$2
              }

              /^Name:/ {
                name=$0
                sub(/^Name:[[:space:]]*/, "", name)

                if (idx == 6) {
                  print name
                  exit
                }
              }
            ' "$WORK/wim-info.txt"
          )"

          echo
          echo "Index 6:"
          echo "$PRO_NAME"

          if [ "$PRO_NAME" != "Windows 11 Pro" ]; then
            echo
            echo "ERROR: Index 6 is not Windows 11 Pro."
            exit 1
          fi

          echo
          echo "Windows 11 Pro confirmed at Index 6."

          echo "WINDOWS_IMAGE_INDEX=6" >> "$GITHUB_ENV"

      - name: Create Autounattend.xml
        env:
          RDP_PASSWORD: ${{ secrets.RDP_PASSWORD }}
        run: |
          set -euxo pipefail

          WORK="$HOME/windows-rdp/work"

          if [ -z "${RDP_PASSWORD:-}" ]; then
            echo "ERROR: RDP_PASSWORD secret is missing."
            exit 1
          fi

          PASSWORD_B64="$(
            printf '%s' "$RDP_PASSWORD" |
            iconv -f UTF-8 -t UTF-16LE |
            base64 -w 0
          )"

          cat > "$WORK/Autounattend.xml" <<EOF
          <?xml version="1.0" encoding="utf-8"?>
          <unattend xmlns="urn:schemas-microsoft-com:unattend">

            <settings pass="windowsPE">
              <component name="Microsoft-Windows-International-Core-WinPE"
                         processorArchitecture="amd64"
                         publicKeyToken="31bf3856ad364e35"
                         language="neutral"
                         versionScope="nonSxS">
                <SetupUILanguage>
                  <UILanguage>en-US</UILanguage>
                </SetupUILanguage>
                <InputLocale>en-US</InputLocale>
                <SystemLocale>en-US</SystemLocale>
                <UILanguage>en-US</UILanguage>
                <UserLocale>en-US</UserLocale>
              </component>

              <component name="Microsoft-Windows-Setup"
                         processorArchitecture="amd64"
                         publicKeyToken="31bf3856ad364e35"
                         language="neutral"
                         versionScope="nonSxS">

                <ImageInstall>
                  <OSImage>
                    <InstallFrom>
                      <MetaData wcm:action="add"
                                xmlns:wcm="http://schemas.microsoft.com/WMIConfig/2002/State">
                        <Key>/IMAGE/INDEX</Key>
                        <Value>6</Value>
                      </MetaData>
                    </InstallFrom>

                    <InstallTo>
                      <DiskID>0</DiskID>
                      <PartitionID>3</PartitionID>
                    </InstallTo>
                  </OSImage>
                </ImageInstall>

                <DiskConfiguration>
                  <Disk wcm:action="add"
                        xmlns:wcm="http://schemas.microsoft.com/WMIConfig/2002/State">
                    <DiskID>0</DiskID>
                    <WillWipeDisk>true</WillWipeDisk>

                    <CreatePartitions>
                      <CreatePartition wcm:action="add">
                        <Order>1</Order>
                        <Size>100</Size>
                        <Type>EFI</Type>
                      </CreatePartition>

                      <CreatePartition wcm:action="add">
                        <Order>2</Order>
                        <Size>16</Size>
                        <Type>MSR</Type>
                      </CreatePartition>

                      <CreatePartition wcm:action="add">
                        <Order>3</Order>
                        <Extend>true</Extend>
                        <Type>Primary</Type>
                      </CreatePartition>
                    </CreatePartitions>

                    <ModifyPartitions>
                      <ModifyPartition wcm:action="add">
                        <Order>1</Order>
                        <PartitionID>1</PartitionID>
                        <Format>FAT32</Format>
                        <Label>System</Label>
                      </ModifyPartition>

                      <ModifyPartition wcm:action="add">
                        <Order>2</Order>
                        <PartitionID>2</PartitionID>
                      </ModifyPartition>

                      <ModifyPartition wcm:action="add">
                        <Order>3</Order>
                        <PartitionID>3</PartitionID>
                        <Format>NTFS</Format>
                        <Label>Windows</Label>
                      </ModifyPartition>
                    </ModifyPartitions>
                  </Disk>
                </DiskConfiguration>

                <UserData>
                  <AcceptEula>true</AcceptEula>

                  <ProductKey>
                    <Key>VK7JG-NPHTM-C97JM-9MPGT-3V66T</Key>
                    <WillShowUI>Never</WillShowUI>
                  </ProductKey>
                </UserData>

              </component>
            </settings>

            <settings pass="specialize">

              <component name="Microsoft-Windows-TerminalServices-LocalSessionManager"
                         processorArchitecture="amd64"
                         publicKeyToken="31bf3856ad364e35"
                         language="neutral"
                         versionScope="nonSxS">
                <fDenyTSConnections>false</fDenyTSConnections>
              </component>

              <component name="Microsoft-Windows-TerminalServices-RDP-WinStationExtensions"
                         processorArchitecture="amd64"
                         publicKeyToken="31bf3856ad364e35"
                         language="neutral"
                         versionScope="nonSxS">
                <UserAuthentication>1</UserAuthentication>
              </component>

            </settings>

            <settings pass="oobeSystem">

              <component name="Microsoft-Windows-Shell-Setup"
                         processorArchitecture="amd64"
                         publicKeyToken="31bf3856ad364e35"
                         language="neutral"
                         versionScope="nonSxS">

                <OOBE>
                  <HideEULAPage>true</HideEULAPage>
                  <HideLocalAccountScreen>true</HideLocalAccountScreen>
                  <HideOEMRegistrationScreen>true</HideOEMRegistrationScreen>
                  <HideOnlineAccountScreens>true</HideOnlineAccountScreens>
                  <HideWirelessSetupInOOBE>true</HideWirelessSetupInOOBE>
                  <ProtectYourPC>3</ProtectYourPC>
                </OOBE>

                <UserAccounts>
                  <LocalAccounts>

                    <LocalAccount wcm:action="add"
                                  xmlns:wcm="http://schemas.microsoft.com/WMI/2002/State">
                      <Name>rdpuser</Name>
                      <DisplayName>RDP User</DisplayName>
                      <Group>Administrators</Group>
                      <Password>
                        <Value>$PASSWORD_B64</Value>
                        <PlainText>false</PlainText>
                      </Password>
                    </LocalAccount>

                  </LocalAccounts>
                </UserAccounts>

                <AutoLogon>
                  <Enabled>true</Enabled>
                  <Username>rdpuser</Username>
                  <Password>
                    <Value>$PASSWORD_B64</Value>
                    <PlainText>false</PlainText>
                  </Password>
                  <LogonCount>1</LogonCount>
                </AutoLogon>

              </component>

            </settings>

            <cpi:offlineImage
              cpi:source="wim:/sources/install.wim#Windows 11 Pro"
              xmlns:cpi="urn:schemas-microsoft-com:cpi" />

          </unattend>
          EOF

          xmllint --noout "$WORK/Autounattend.xml"

          echo
          echo "Autounattend.xml is valid."

      - name: Create unattended ISO
        run: |
          set -euxo pipefail

          WORK="$HOME/windows-rdp/work"

          xorriso \
            -as mkisofs \
            -iso-level 3 \
            -J \
            -R \
            -V "AUTOUNATTEND" \
            -o "$WORK/autounattend.iso" \
            "$WORK"

          ls -lh "$WORK/autounattend.iso"

      - name: Create Windows virtual disk
        run: |
          set -euxo pipefail

          qemu-img create \
            -f qcow2 \
            "$HOME/windows-rdp/work/windows.qcow2" \
            64G

          qemu-img info "$HOME/windows-rdp/work/windows.qcow2"

      - name: Prepare UEFI firmware
        run: |
          set -euxo pipefail

          OVMF_CODE=""

          for f in \
            /usr/share/OVMF/OVMF_CODE_4M.ms.fd \
            /usr/share/OVMF/OVMF_CODE_4M.secboot.fd \
            /usr/share/OVMF/OVMF_CODE.fd
          do
            if [ -f "$f" ]; then
              OVMF_CODE="$f"
              break
            fi
          done

          if [ -z "$OVMF_CODE" ]; then
            echo "ERROR: OVMF code firmware not found."
            exit 1
          fi

          OVMF_VARS=""

          for f in \
            /usr/share/OVMF/OVMF_VARS_4M.ms.fd \
            /usr/share/OVMF/OVMF_VARS_4M.fd \
            /usr/share/OVMF/OVMF_VARS.fd
          do
            if [ -f "$f" ]; then
              OVMF_VARS="$f"
              break
            fi
          done

          if [ -z "$OVMF_VARS" ]; then
            echo "ERROR: OVMF variables firmware not found."
            exit 1
          fi

          cp "$OVMF_CODE" \
            "$HOME/windows-rdp/ovmf/OVMF_CODE.fd"

          cp "$OVMF_VARS" \
            "$HOME/windows-rdp/ovmf/OVMF_VARS.fd"

          chmod 644 \
            "$HOME/windows-rdp/ovmf/OVMF_CODE.fd" \
            "$HOME/windows-rdp/ovmf/OVMF_VARS.fd"

          echo "OVMF_CODE=$HOME/windows-rdp/ovmf/OVMF_CODE.fd" >> "$GITHUB_ENV"
          echo "OVMF_VARS=$HOME/windows-rdp/ovmf/OVMF_VARS.fd" >> "$GITHUB_ENV"

      - name: Start virtual TPM
        run: |
          set -euxo pipefail

          mkdir -p "$HOME/windows-rdp/work/tpm"

          swtpm socket \
            --tpm2 \
            --tpmstate dir="$HOME/windows-rdp/work/tpm" \
            --ctrl type=unixio,path="$HOME/windows-rdp/work/swtpm.sock" \
            --daemon

          sleep 2

          test -S "$HOME/windows-rdp/work/swtpm.sock"

          echo "Virtual TPM is running."

      - name: Start Windows 11 VM with KVM
        run: |
          set -euxo pipefail

          WORK="$HOME/windows-rdp/work"

          echo "Starting REAL Windows 11 VM."
          echo "KVM acceleration is REQUIRED."

          qemu-system-x86_64 \
            -enable-kvm \
            -machine q35,accel=kvm \
            -cpu host \
            -m 8G \
            -smp 4 \
            -drive if=pflash,format=raw,readonly=on,file="$OVMF_CODE" \
            -drive if=pflash,format=raw,file="$OVMF_VARS" \
            -chardev socket,id=chrtpm,path="$WORK/swtpm.sock" \
            -tpmdev emulator,id=tpm0,chardev=chrtpm \
            -device tpm-tis,tpmdev=tpm0 \
            -drive file="$WORK/windows.qcow2",format=qcow2,if=ide \
            -drive file="$HOME/windows-rdp/windows.iso",media=cdrom,readonly=on \
            -drive file="$WORK/autounattend.iso",media=cdrom,readonly=on \
            -netdev user,id=net0,hostfwd=tcp:127.0.0.1:3389-:3389 \
            -device e1000,netdev=net0 \
            -boot once=d \
            -display none \
            -serial file:"$WORK/qemu-serial.log" \
            -monitor unix:"$WORK/qemu-monitor.sock",server=on,wait=off \
            -pidfile "$WORK/qemu.pid" \
            -daemonize

          sleep 5

          if [ ! -f "$WORK/qemu.pid" ]; then
            echo "ERROR: QEMU did not create its PID file."
            cat "$WORK/qemu-serial.log" || true
            exit 1
          fi

          QEMU_PID="$(cat "$WORK/qemu.pid")"

          if ! kill -0 "$QEMU_PID" 2>/dev/null; then
            echo "ERROR: QEMU stopped."
            echo
            echo "===== QEMU SERIAL LOG ====="
            cat "$WORK/qemu-serial.log" || true
            exit 1
          fi

          echo
          echo "======================================"
          echo "WINDOWS VM IS RUNNING"
          echo "======================================"

          echo "PID: $QEMU_PID"
          echo "RDP: 127.0.0.1:3389"

      - name: Wait for Windows RDP
        run: |
          set -euxo pipefail

          WORK="$HOME/windows-rdp/work"

          echo "Waiting for Windows to finish installation..."

          for i in $(seq 1 90); do

            if [ -f "$WORK/qemu.pid" ]; then
              QEMU_PID="$(cat "$WORK/qemu.pid")"

              if ! kill -0 "$QEMU_PID" 2>/dev/null; then
                echo
                echo "ERROR: Windows VM stopped."

                echo
                echo "===== QEMU SERIAL LOG ====="
                cat "$WORK/qemu-serial.log" || true

                exit 1
              fi
            else
              echo "ERROR: QEMU PID file disappeared."
              exit 1
            fi

            if nc -z 127.0.0.1 3389; then
              echo
              echo "======================================"
              echo "RDP PORT IS OPEN"
              echo "======================================"

              exit 0
            fi

            echo "[$i/90] RDP not ready yet..."

            sleep 40
          done

          echo
          echo "ERROR: RDP did not become available."

          echo
          echo "===== QEMU SERIAL LOG ====="
          cat "$WORK/qemu-serial.log" || true

          exit 1

      - name: Keep Windows VM alive
        run: |
          set -euxo pipefail

          WORK="$HOME/windows-rdp/work"

          echo
          echo "======================================"
          echo "WINDOWS 11 VM READY"
          echo "======================================"

          echo
          echo "RDP is listening on:"
          echo "127.0.0.1:3389"

          echo
          echo "Username:"
          echo "rdpuser"

          echo
          echo "The VM will remain alive while this GitHub job runs."

          for i in $(seq 1 150); do

            if [ ! -f "$WORK/qemu.pid" ]; then
              echo "QEMU PID file disappeared."
              exit 1
            fi

            QEMU_PID="$(cat "$WORK/qemu.pid")"

            if ! kill -0 "$QEMU_PID" 2>/dev/null; then
              echo "Windows VM stopped."

              echo
              echo "===== QEMU SERIAL LOG ====="
              cat "$WORK/qemu-serial.log" || true

              exit 1
            fi

            echo "Windows VM alive - $i/150"

            sleep 20
          done

      - name: Cleanup
        if: always()
        run: |
          set +e

          WORK="$HOME/windows-rdp/work"

          if [ -f "$WORK/qemu.pid" ]; then
            QEMU_PID="$(cat "$WORK/qemu.pid")"
            kill "$QEMU_PID" 2>/dev/null || true
          fi

          pkill -f swtpm 2>/dev/null || true

          echo "Cleanup complete."
